<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>課程內頁｜三種元件設計方向</title>
  <style>
    :root {
      --paper: #f8f5ef;
      --sand: #e8dfd2;
      --ink: #38342e;
      --muted: #756b60;
      --clay: #a46b54;
      --saffron: #f8bf4c;
      --oxblood: #392618;
      --night: #241710;
      --bark: #766254;
      --persimmon: #df5b35;
      --warm-white: #f7f6f4;
      --line: rgba(57, 38, 24, .2);
      --edge: clamp(24px, 5.7vw, 110px);
      --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      --sans: "BIZ UDPGothic", "Noto Sans TC", "PingFang TC", sans-serif;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --chooser-height: 82px;
      --header-height: 87px;
    }

    * { box-sizing: border-box; }
    html { overflow-x: hidden; scroll-behavior: smooth; background: #d8cfc3; }
    body { min-width: 320px; margin: 0; overflow-x: hidden; color: var(--ink); background: #d8cfc3; font-family: var(--sans); }
    button, a { color: inherit; font: inherit; }
    button { cursor: pointer; }
    a { text-underline-offset: .28em; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p, blockquote { margin-top: 0; }
    ::selection { color: var(--warm-white); background: var(--persimmon); }
    :focus-visible { outline: 2px solid var(--persimmon); outline-offset: 5px; }
    * { scrollbar-color: var(--clay) var(--paper); scrollbar-width: thin; }

    .prototype { width: min(100%, 1920px); margin: 0 auto; background: var(--paper); }
    .chooser { position: sticky; z-index: 300; top: 0; display: grid; width: 100%; min-width: 0; min-height: var(--chooser-height); grid-template-columns: minmax(210px, .65fr) minmax(480px, 1.35fr); align-items: center; gap: 32px; padding: 10px var(--edge); color: var(--warm-white); background: rgba(36, 23, 16, .985); border-bottom: 1px solid rgba(255,255,255,.16); }
    .chooser__copy { font-size: 12px; line-height: 1.55; letter-spacing: .06em; }
    .chooser__copy small { display: block; color: #cdbdaf; font-size: 10px; }
    .tabs { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tab { width: 100%; min-width: 0; min-height: 48px; padding: 7px 14px; overflow: hidden; color: var(--warm-white); background: transparent; border: 1px solid rgba(255,255,255,.26); text-align: left; transition: color 180ms ease, background 180ms ease, border 180ms ease; }
    .tab span { display: block; font-family: var(--serif); font-size: 14px; }
    .tab small { display: block; margin-top: 3px; overflow-wrap: anywhere; color: #d1c1b4; font-size: 11px; letter-spacing: .06em; }
    .tab[aria-selected="true"] { color: var(--ink); background: var(--saffron); border-color: var(--saffron); }
    .tab[aria-selected="true"] small { color: #4c3b20; }
    .concept[hidden] { display: none; }

    .site-header { display: flex; height: var(--header-height); align-items: center; justify-content: space-between; gap: 32px; padding: 0 var(--edge); background: rgba(248,245,239,.97); border-bottom: 1px solid var(--line); }
    .logo { width: clamp(150px, 15vw, 190px); }
    .logo img { width: 100%; height: auto; }
    .site-nav { display: flex; align-items: center; gap: clamp(20px, 2.5vw, 42px); font-size: 12px; font-weight: 600; letter-spacing: .12em; }
    .site-nav a { text-decoration: none; }
    .site-nav a[aria-current="page"] { padding-bottom: 8px; border-bottom: 1px solid currentColor; }

    .display { font-family: var(--serif); font-weight: 400; line-height: 1.12; letter-spacing: .055em; }
    .lede { max-width: 42em; font-size: clamp(15px, 1.15vw, 18px); line-height: 2; letter-spacing: .045em; }
    .body-copy { max-width: 70ch; color: var(--muted); font-size: 15px; line-height: 2.05; letter-spacing: .04em; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 18px 34px; padding: 0; margin: 0; list-style: none; font-size: 12px; line-height: 1.7; letter-spacing: .07em; }
    .meta-row strong { display: block; color: var(--clay); font-size: 10px; font-weight: 600; letter-spacing: .14em; }
    .primary { display: inline-flex; min-height: 76px; align-items: center; justify-content: space-between; gap: 36px; padding: 0 34px; color: var(--warm-white); background: var(--persimmon); border: 0; text-decoration: none; letter-spacing: .08em; transition: background 180ms ease, transform 420ms var(--ease); }
    .primary:hover { background: #c94f34; transform: translateY(-3px); }
    .primary[disabled] { color: #f3e9e1; background: var(--clay); cursor: not-allowed; }
    .primary[disabled]:hover { background: var(--clay); transform: none; }
    .arrow { position: relative; width: 22px; height: 22px; flex: 0 0 22px; }
    .arrow::before { position: absolute; top: 10px; left: 1px; width: 18px; border-top: 1.5px solid currentColor; content: ""; }
    .arrow::after { position: absolute; top: 6px; right: 2px; width: 9px; height: 9px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg); content: ""; }
    .arrow--back { transform: rotate(180deg); }
    .image { position: relative; min-height: 320px; overflow: hidden; background: var(--sand); }
    .image img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.75) sepia(.08); transition: filter 500ms ease, transform 1.1s var(--ease); }
    .image:hover img { filter: saturate(.95); transform: scale(1.018); }
    .prototype-note { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 26px var(--edge); color: #d7c7ba; background: var(--night); border-top: 1px solid rgba(255,255,255,.13); font-size: 11px; line-height: 1.8; letter-spacing: .06em; }
    .prototype-note strong { color: var(--saffron); font-weight: 600; }
    .prototype-note span:last-child { max-width: 60em; text-align: right; }
    .support-suite { padding: clamp(100px, 12vw, 180px) var(--edge); background: var(--paper); }
    .support-suite__head { display: flex; align-items: end; justify-content: space-between; gap: 40px; margin-bottom: 70px; }
    .support-suite__head h2 { max-width: 8em; margin: 0; font-size: clamp(42px, 4.7vw, 74px); }
    .support-suite__head p { max-width: 36em; margin: 0; }
    .schedule { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); }
    .schedule__item { display: grid; min-height: 220px; grid-template-columns: minmax(0,1fr) auto; align-content: space-between; gap: 30px; padding: 32px 34px 32px 0; border-bottom: 1px solid var(--line); }
    .schedule__item:nth-child(even) { padding-left: 34px; border-left: 1px solid var(--line); }
    .schedule__item h3 { margin: 0; font-family: var(--serif); font-size: clamp(24px, 2.4vw, 36px); font-weight: 400; }
    .schedule__item p { grid-column: 1/-1; margin: 0; color: var(--muted); line-height: 1.8; }
    .status { align-self: start; padding: 8px 10px; color: var(--oxblood); background: var(--saffron); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .testimonial-slider { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 40px; min-height: 340px; padding: 70px 0; border-bottom: 1px solid var(--line); }
    .testimonial-slider blockquote { max-width: 30em; margin: 0; font-family: var(--serif); font-size: clamp(24px, 2.8vw, 42px); line-height: 1.7; letter-spacing: .04em; }
    .testimonial-slider cite { display: block; margin-top: 26px; color: var(--clay); font-family: var(--sans); font-size: 11px; font-style: normal; letter-spacing: .1em; }
    .testimonial-slider__controls { display: flex; gap: 8px; }
    .testimonial-slider__controls button { width: 48px; height: 48px; color: var(--ink); background: transparent; border: 1px solid var(--line); font-size: 18px; }
    .testimonial-slider__controls .arrow { display: block; margin: auto; }
    .media-swiper { margin-top: 90px; padding-top: 70px; border-top: 1px solid var(--line); }
    .media-swiper__head { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 32px; }
    .media-swiper__head h3 { margin: 0; font-family: var(--serif); font-size: clamp(28px, 3vw, 44px); font-weight: 400; }
    .media-swiper__controls { display: flex; gap: 8px; }
    .media-swiper__controls button { width: 48px; height: 48px; color: var(--ink); background: transparent; border: 1px solid var(--line); }
    .media-swiper__controls .arrow { display: block; margin: auto; }
    .media-swiper__track { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .media-swiper__track::-webkit-scrollbar { display: none; }
    .media-slide { min-width: calc((100% - 36px) / 3); scroll-snap-align: start; }
    .media-slide .image { min-height: 240px; aspect-ratio: 4/3; }
    .media-slide h4 { margin: 22px 0 10px; font-family: var(--serif); font-size: 23px; font-weight: 400; }
    .media-slide p { color: var(--muted); line-height: 1.8; }
    .editorial-rail { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1px; margin-top: 90px; background: var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .editorial-card { display: flex; min-height: 310px; flex-direction: column; justify-content: space-between; padding: 34px; background: var(--paper); text-decoration: none; }
    .editorial-card span { color: var(--clay); font-size: 11px; letter-spacing: .1em; }
    .editorial-card h3 { margin: 70px 0 20px; font-family: var(--serif); font-size: clamp(23px, 2.3vw, 34px); font-weight: 400; line-height: 1.5; }
    .editorial-card p { color: var(--muted); line-height: 1.8; }

    /* A — 章節潮汐 */
    .a { background: var(--paper); }
    .a-hero { display: grid; min-height: calc(100svh - var(--chooser-height) - var(--header-height)); grid-template-columns: minmax(0, 58%) minmax(340px, 42%); }
    .a-hero__visual { position: relative; min-height: 650px; background: var(--sand); }
    .a-hero__visual img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.7) contrast(.95); }
    .a-hero__visual::after { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 54%, rgba(36,23,16,.22)); content: ""; }
    .a-hero__title { position: absolute; z-index: 2; right: clamp(-190px, -10vw, -120px); bottom: 10%; max-width: 7.6em; margin: 0; color: var(--warm-white); font-size: clamp(66px, 7.7vw, 126px); text-shadow: 0 8px 30px rgba(36,23,16,.3); }
    .a-hero__copy { display: flex; flex-direction: column; justify-content: space-between; gap: 50px; padding: clamp(58px, 6vw, 96px) var(--edge) 44px clamp(86px, 9vw, 165px); background: var(--oxblood); color: var(--warm-white); }
    .a-hero__copy .lede { color: #eaded4; }
    .a-hero__copy .meta-row { padding-top: 24px; border-top: 1px solid rgba(255,255,255,.2); }
    .a-hero__copy .meta-row strong { color: var(--saffron); }
    .a-hero__copy .primary { align-self: stretch; }
    .a-chapters { position: sticky; z-index: 20; top: var(--chooser-height); display: flex; min-height: 60px; align-items: center; justify-content: center; gap: clamp(20px, 4vw, 70px); padding: 8px var(--edge); background: rgba(248,245,239,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .a-chapters a { display: inline-flex; min-height: 44px; align-items: center; color: var(--muted); font-size: 11px; text-decoration: none; letter-spacing: .1em; }
    .a-chapters a[aria-current="location"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px var(--saffron); }
    .a-intro { display: grid; grid-template-columns: .7fr 1.3fr; gap: clamp(55px, 8vw, 140px); padding: clamp(120px, 13vw, 210px) var(--edge); }
    .a-intro h2 { max-width: 7em; margin: 0; font-size: clamp(48px, 5.2vw, 82px); }
    .a-intro__text p:first-child { color: var(--ink); font-family: var(--serif); font-size: clamp(24px, 2.2vw, 34px); line-height: 1.75; letter-spacing: .045em; }
    .a-story { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr); background: var(--sand); }
    .a-story .image { min-height: 720px; }
    .a-story__copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(80px, 10vw, 170px) var(--edge); }
    .a-story h2 { margin-bottom: 34px; font-size: clamp(42px, 4.3vw, 68px); }
    .a-quote { padding: clamp(105px, 13vw, 210px) var(--edge); color: var(--warm-white); background: var(--bark); text-align: center; }
    .a-quote blockquote { max-width: 25em; margin: 0 auto; font-family: var(--serif); font-size: clamp(28px, 3.4vw, 54px); line-height: 1.65; letter-spacing: .06em; }
    .a-quote cite { display: block; margin-top: 34px; color: #eaded4; font-size: 12px; font-style: normal; letter-spacing: .14em; }
    .a-curriculum { display: grid; grid-template-columns: minmax(250px, .55fr) minmax(0, 1.45fr); gap: clamp(50px, 8vw, 150px); padding: clamp(120px, 13vw, 210px) var(--edge); }
    .a-curriculum__head { position: sticky; top: calc(var(--chooser-height) + 90px); align-self: start; }
    .a-curriculum h2 { font-size: clamp(46px, 5vw, 78px); }
    .accordion { border-top: 1px solid var(--line); }
    .accordion__item { border-bottom: 1px solid var(--line); }
    .accordion__button { display: grid; width: 100%; min-height: 112px; grid-template-columns: 92px 1fr 28px; align-items: center; gap: 24px; padding: 20px 0; color: var(--ink); background: transparent; border: 0; text-align: left; }
    .accordion__button span:first-child { color: var(--clay); font-size: 11px; letter-spacing: .12em; }
    .accordion__button strong { font-family: var(--serif); font-size: clamp(23px, 2.3vw, 36px); font-weight: 400; }
    .accordion__button i { position: relative; width: 20px; height: 20px; }
    .accordion__button i::before, .accordion__button i::after { position: absolute; top: 9px; left: 2px; width: 16px; border-top: 1px solid currentColor; content: ""; transition: transform 260ms ease; }
    .accordion__button i::after { transform: rotate(90deg); }
    .accordion__button[aria-expanded="true"] i::after { transform: rotate(0); }
    .accordion__panel { max-width: 65ch; padding: 0 0 38px 116px; color: var(--muted); line-height: 1.95; }
    .accordion__panel[hidden] { display: none; }
    .a-register { display: grid; grid-template-columns: 1fr 1fr; background: var(--night); color: var(--warm-white); }
    .a-register__copy { padding: clamp(85px, 10vw, 160px) var(--edge); }
    .a-register h2 { font-size: clamp(44px, 5vw, 78px); }
    .a-register .body-copy { color: #d8c7b8; }
    .a-register .meta-row { padding: 35px 0; margin: 35px 0; border-top: 1px solid rgba(255,255,255,.18); border-bottom: 1px solid rgba(255,255,255,.18); }
    .a-register .meta-row strong { color: var(--saffron); }
    .a-register .image { min-height: 640px; }

    /* B — 雙域剖面 */
    .b-shell { display: grid; grid-template-columns: minmax(340px, 35%) minmax(0, 65%); align-items: start; }
    .b-rail { position: sticky; top: var(--chooser-height); display: flex; height: calc(100svh - var(--chooser-height)); min-height: 650px; flex-direction: column; justify-content: space-between; padding: clamp(58px, 5vw, 86px) clamp(32px, 4vw, 72px) 38px; color: var(--warm-white); background: var(--oxblood); }
    .b-rail h1 { max-width: 7em; margin: 0; font-size: clamp(54px, 5.3vw, 82px); }
    .b-rail .lede { margin-top: 32px; color: #e3d4c9; font-size: 14px; }
    .b-rail .meta-row { margin-top: 30px; }
    .b-rail .meta-row strong { color: var(--saffron); }
    .b-rail__actions { display: grid; gap: 18px; }
    .b-rail__nav { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .b-rail__nav a { display: inline-flex; min-height: 44px; align-items: center; color: #d4c3b6; font-size: 11px; line-height: 1.7; letter-spacing: .08em; }
    .b-rail__nav a[aria-current="location"] { color: var(--saffron); font-weight: 700; }
    .b-content { min-width: 0; background: var(--paper); }
    .b-image { height: clamp(520px, 72vh, 820px); }
    .b-section { display: grid; grid-template-columns: minmax(120px, .42fr) minmax(0, 1.58fr); gap: clamp(30px, 5vw, 90px); padding: clamp(100px, 12vw, 190px) var(--edge); border-bottom: 1px solid var(--line); }
    .b-section__title { position: sticky; top: calc(var(--chooser-height) + 40px); align-self: start; }
    .b-section h2 { margin: 0; font-size: clamp(38px, 4.1vw, 64px); }
    .b-section__body > .lede { color: var(--ink); font-family: var(--serif); font-size: clamp(23px, 2.2vw, 34px); }
    .b-teacher { display: grid; grid-template-columns: minmax(210px, .75fr) minmax(0, 1.25fr); gap: clamp(34px, 5vw, 90px); margin-top: 72px; }
    .b-teacher .image { aspect-ratio: 3/4; min-height: 0; background: var(--clay); }
    .b-teacher h3 { font-family: var(--serif); font-size: clamp(28px, 2.7vw, 42px); font-weight: 400; }
    .b-curriculum { padding-top: 0; }
    .b-module { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 28px; padding: 38px 0; border-top: 1px solid var(--line); }
    .b-module:first-child { border-top-color: var(--ink); }
    .b-module__stage { color: var(--clay); font-size: 11px; line-height: 1.8; letter-spacing: .12em; }
    .b-module h3 { margin-bottom: 18px; font-family: var(--serif); font-size: clamp(24px, 2.2vw, 34px); font-weight: 400; }
    .b-module ul { padding-left: 1.15em; color: var(--muted); line-height: 2; }
    .b-video { position: relative; display: grid; min-height: 560px; place-items: center; overflow: hidden; color: var(--warm-white); background: var(--night); }
    .b-video::before { position: absolute; inset: 0; background: url("../../public/images/home-banner-2.jpg") center/cover; filter: saturate(.35) brightness(.48); content: ""; transform: scale(1.02); }
    .b-video__button { position: relative; z-index: 2; display: grid; width: 126px; height: 126px; place-items: center; color: var(--warm-white); background: rgba(36,23,16,.45); border: 1px solid rgba(255,255,255,.55); border-radius: 50%; letter-spacing: .08em; }
    .b-video__button::after { width: 0; height: 0; margin-left: 7px; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 16px solid currentColor; content: ""; }
    .b-video__button[disabled] { opacity: .65; cursor: not-allowed; }
    .b-video__status { position: absolute; z-index: 2; margin-top: 190px; font-size: 11px; letter-spacing: .1em; }
    .b-audience { color: var(--warm-white); background: var(--bark); }
    .b-audience .body-copy { color: #eaded4; }
    .b-audience ul { display: grid; padding: 0; margin: 50px 0 0; list-style: none; }
    .b-audience li { padding: 26px 0; border-top: 1px solid rgba(255,255,255,.2); font-family: var(--serif); font-size: clamp(19px, 2vw, 30px); line-height: 1.55; }

    /* C — 感知圖譜 */
    .c { background: var(--paper); }
    .c-hero { position: relative; min-height: calc(100svh - var(--chooser-height) - var(--header-height)); padding: clamp(70px, 8vw, 130px) var(--edge); overflow: hidden; background: var(--sand); isolation: isolate; }
    .c-hero::before, .c-hero::after { position: absolute; z-index: -1; border: 1px solid rgba(164,107,84,.38); border-radius: 46% 54% 43% 57% / 52% 35% 65% 48%; content: ""; }
    .c-hero::before { width: 64vw; height: 54vw; top: -26vw; right: -5vw; transform: rotate(12deg); }
    .c-hero::after { width: 44vw; height: 36vw; right: 5vw; bottom: -23vw; transform: rotate(-20deg); }
    .c-hero__top { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); align-items: end; gap: clamp(50px, 8vw, 150px); }
    .c-hero h1 { max-width: 8.4em; margin: 0; font-size: clamp(72px, 9.3vw, 154px); }
    .c-hero__copy { padding-bottom: 15px; }
    .c-hero__copy .lede { font-family: var(--serif); font-size: clamp(21px, 2vw, 31px); }
    .c-path { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; padding-top: clamp(90px, 12vw, 180px); }
    .c-path::before { position: absolute; top: calc(clamp(90px, 12vw, 180px) + 8px); right: 0; left: 0; border-top: 1px solid var(--clay); content: ""; }
    .c-path a { position: relative; display: inline-flex; min-height: 72px; align-items: flex-start; padding-top: 28px; color: var(--muted); font-size: 11px; line-height: 1.7; text-decoration: none; letter-spacing: .08em; }
    .c-path a::before { position: absolute; top: 2px; left: 0; width: 13px; height: 13px; background: var(--paper); border: 1px solid var(--clay); border-radius: 50%; content: ""; }
    .c-path a[aria-current="location"] { color: var(--ink); font-weight: 700; }
    .c-path a[aria-current="location"]::before { background: var(--saffron); box-shadow: 0 0 0 5px rgba(248,191,76,.26); }
    .c-meta { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .c-meta > div { min-height: 122px; padding: 28px var(--edge); border-right: 1px solid var(--line); }
    .c-meta > div:last-child { border-right: 0; }
    .c-meta strong { display: block; margin-bottom: 12px; color: var(--clay); font-size: 10px; letter-spacing: .14em; }
    .c-meta span { font-family: var(--serif); font-size: clamp(18px, 1.8vw, 27px); line-height: 1.45; }
    .c-atlas { padding: clamp(110px, 13vw, 200px) var(--edge); }
    .c-block { position: relative; display: grid; min-height: 620px; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr); align-items: center; gap: clamp(50px, 8vw, 140px); padding: clamp(60px, 7vw, 110px) 0; border-bottom: 1px solid var(--line); }
    .c-block:first-child { padding-top: 0; }
    .c-block:nth-child(even) .c-block__copy { order: -1; }
    .c-block .image { min-height: 520px; }

    const arrow = `<span class="arrow" aria-hidden="true"></span>`;
    const meta = `<ul class="meta-row"><li><strong>形式</strong>實體課程</li><li><strong>時間</strong>09:30–18:30</li><li><strong>地點</strong>普那生活空間・高雄</li></ul>`;
    const imageA = `<figure class="image"><img src="../../public/images/home-banner.jpg" alt="鋪著白色床巾、被午後光線照亮的身體工作空間" width="1600" height="1066"></figure>`;
    const imageB = `<figure class="image"><img src="../../public/images/home-banner-2.jpg" alt="自然光落在按摩床與安靜室內空間" width="1600" height="1066"></figure>`;
    const accordion = `<div class="accordion"><div class="accordion__item"><button class="accordion__button" aria-expanded="true"><span>第一階</span><strong>日式回春面部按摩初級班</strong><i aria-hidden="true"></i></button><div class="accordion__panel">學習日本對健康和美麗的觀念、30 個日式面部按摩技巧、頸前區按摩技巧，以及手工淋巴引流技巧。</div></div><div class="accordion__item"><button class="accordion__button" aria-expanded="false"><span>第二階</span><strong>高級班：整合完整個案</strong><i aria-hidden="true"></i></button><div class="accordion__panel" hidden>深化面部按摩、後頸、頭部與頭皮技巧，並整合前兩階段，建立完整的治療性面部按摩個案。</div></div><div class="accordion__item"><button class="accordion__button" aria-expanded="false"><span>第三階</span><strong>除皺指壓與能量激活</strong><i aria-hidden="true"></i></button><div class="accordion__panel" hidden>認識面部經絡、穴位與指壓步驟，以溫和方式支持臉部能量流動。</div></div></div>`;
    const supportSuite = `<section class="support-suite"><div class="support-suite__head"><h2 class="display">把參與條件看清楚，再安心決定。</h2><p class="body-copy">排程、狀態、學員分享與相關文章都使用可重用元件；內容尚未核准時，清楚顯示狀態，不製造稀缺感。</p></div><div class="schedule"><article class="schedule__item"><h3>高雄・第一階</h3><span class="status">日期待確認</span><p>09:30–18:30・普那生活空間<br>名額與費用由內容負責人確認後顯示。</p></article><article class="schedule__item"><h3>高雄・第二階</h3><span class="status">尚未開放</span><p>需完成第一階；正式日期、名額與報名狀態待發布。</p></article></div><div class="testimonial-slider" data-testimonials><div><blockquote>「看似在外部工作，卻也在內心鬆綁。當我們慢下來，便能用一份寧靜去陪伴。」</blockquote><cite>學員分享節錄・示意內容</cite></div><div class="testimonial-slider__controls"><button type="button" data-testimonial-prev aria-label="上一則學員分享"><span class="arrow arrow--back" aria-hidden="true"></span></button><button type="button" data-testimonial-next aria-label="下一則學員分享"><span class="arrow" aria-hidden="true"></span></button></div></div><div class="media-swiper" data-scroll-region><div class="media-swiper__head"><h3>圖文輪播元件</h3><div class="media-swiper__controls"><button type="button" data-scroll-prev aria-label="上一張圖文"><span class="arrow arrow--back" aria-hidden="true"></span></button><button type="button" data-scroll-next aria-label="下一張圖文"><span class="arrow" aria-hidden="true"></span></button></div></div><div class="media-swiper__track" data-scroll-track tabindex="0" aria-label="課程圖文輪播"><article class="media-slide">${imageA}<h4>肩頸與臉部</h4><p>從支持與放鬆開始練習。</p></article><article class="media-slide">${imageB}<h4>手位與節奏</h4><p>讓技巧在反覆操作中成為身體記憶。</p></article><article class="media-slide"><div class="image" aria-hidden="true"></div><h4>整合完整個案</h4><p>在安全界線中完成一套可實踐的方法。</p></article></div></div><div class="media-swiper__head" style="margin-top:90px"><h3>相關文章</h3><div class="media-swiper__controls" data-scroll-region><button type="button" data-scroll-prev aria-label="上一篇文章"><span class="arrow arrow--back" aria-hidden="true"></span></button><button type="button" data-scroll-next aria-label="下一篇文章"><span class="arrow" aria-hidden="true"></span></button></div></div><div class="editorial-rail" data-scroll-track tabindex="0" aria-label="相關文章"><article class="editorial-card"><span>身體覺察・文章待發布</span><div><h3>觸碰之前，先回到自己的呼吸</h3><p>理解臨在如何成為身體工作的起點。</p></div></article><article class="editorial-card"><span>方法筆記・文章待發布</span><div><h3>為什麼輕柔不等於沒有深度</h3><p>從神經系統與組織感受重新理解力道。</p></div></article><article class="editorial-card"><span>課前閱讀・文章待發布</span><div><h3>第一次參加身體工作課程，可以準備什麼？</h3><p>衣著、界線與學習節奏的實用提醒。</p></div></article></div></section>`;

    const conceptA = `<article id="concept-a" class="concept a" role="tabpanel" aria-labelledby="tab-a">${header}<section class="a-hero"><div class="a-hero__visual"><img src="../../public/images/home-banner.jpg" alt="溫暖日光中的身體工作空間" width="1600" height="1066"><h1 class="a-hero__title display">日式回春<br>面部按摩</h1></div><div class="a-hero__copy"><div><p class="lede">以溫柔的碰觸，讓臉部與身體重新記得放鬆。從肩頸、面部到頭部，學習一套由內而外滋養自己的完整手法。</p>${meta}</div><a class="primary" href="#a-register"><span>查看梯次與報名</span>${arrow}</a></div></section><nav class="a-chapters" aria-label="頁內章節"><a href="#a-about" aria-current="location">課程介紹</a><a href="#a-teacher">帶領者</a><a href="#a-course">課程架構</a><a href="#a-register">日期與報名</a></nav><section class="a-intro" id="a-about"><h2 class="display">愈是溫柔，愈能讓身體鬆開。</h2><div class="a-intro__text"><p>面部肌肉十分細緻敏感。這份工作不是矯正，而是透過輕彈、按壓與手指漫步，讓我們練習聽見身體。</p><p class="body-copy">課程融合穴位、傳統日式臉部護理與當代身心學。從肩頸的碰觸開始，撫慰平日蓄積的壓力，支持血液循環與淋巴流動，也在身體形成一份新的註記：我可以慢下來，也可以溫柔地接受自己。</p></div></section><section class="a-story" id="a-teacher">${imageB}<div class="a-story__copy"><h2 class="display">帶領者與這套方法</h2><p class="body-copy">這裡保留教師照片、姓名、資格與完整生命經驗的敘事空間。長文不被壓縮成卡片，讓信任從真實經歷與方法脈絡中慢慢建立。</p><p class="body-copy">編輯者可使用左右圖文元件，依內容節奏交替安排；手機版一律先圖後文，維持清楚閱讀順序。</p></div></section><section class="a-quote"><blockquote>「當我們慢下來、靜下來，不是去矯正，而是陪伴與傾聽。」</blockquote><cite>學員分享節錄・示意內容</cite></section><section class="a-curriculum" id="a-course"><div class="a-curriculum__head"><h2 class="display">三階段，讓技巧成為一種覺察。</h2><p class="body-copy">每一階都能清楚展開內容；預設只打開第一階，避免長篇大綱一次淹沒讀者。</p></div>${accordion}</section>${supportSuite}<section class="a-register" id="a-register"><div class="a-register__copy"><h2 class="display">下一梯，從高雄開始。</h2><p class="body-copy">日期與地點為舊站內容示意，正式發布前仍須由內容負責人確認。</p>${meta}<button class="primary" type="button" disabled><span>報名資訊待確認</span>${arrow}</button></div>${imageA}</section><footer class="prototype-note"><strong>A｜章節潮汐</strong><span>優勢是情緒與信任建立最完整；適合師資故事、方法理念與學員分享較多的課程。風險是長頁需要嚴格編輯節奏。</span></footer></article>`;

    const modules = `<div class="b-module"><div class="b-module__stage">第一階</div><div><h3>日式回春面部按摩初級班</h3><ul><li>30 個日式面部按摩技巧</li><li>頸前區按摩與手工淋巴引流</li><li>日本對健康與美麗的觀念</li></ul></div></div><div class="b-module"><div class="b-module__stage">第二階</div><div><h3>進階技巧與完整個案</h3><ul><li>後頸、頭部與頭皮按摩</li><li>整合第一、第二階段技巧</li><li>建立完整的治療性面部護理流程</li></ul></div></div><div class="b-module"><div class="b-module__stage">第三階</div><div><h3>除皺指壓與能量激活</h3><ul><li>面部六條經絡與穴位</li><li>眼部、眉毛與前額指壓步驟</li><li>以溫和方式支持能量流動</li></ul></div></div>`;
    const conceptB = `<article id="concept-b" class="concept b" role="tabpanel" aria-labelledby="tab-b" hidden>${header}<div class="b-shell"><aside class="b-rail"><div><h1 class="display">日式回春面部按摩</h1><p class="lede">從最細緻的碰觸展開，讓身心重新感覺穩定、舒緩與完整。</p>${meta}</div><div class="b-rail__actions"><nav class="b-rail__nav" aria-label="頁內章節"><a href="#b-about" aria-current="location">課程介紹</a><a href="#b-teacher">帶領者</a><a href="#b-course">課程架構</a><a href="#b-audience">適合對象</a></nav><button class="primary" type="button" disabled><span>報名資訊待確認</span>${arrow}</button></div></aside><div class="b-content"><div class="image b-image"><img src="../../public/images/home-banner-2.jpg" alt="自然光落在按摩床上的身體工作空間" width="1600" height="1066"></div><section class="b-section" id="b-about"><div class="b-section__title"><h2 class="display">方法</h2></div><div class="b-section__body"><p class="lede">輕柔，不代表表面。細緻的碰觸能讓臉部的能量流動舒展，也讓整體回到更和諧的狀態。</p><p class="body-copy">課程融合穴位、傳統日式臉部護理與當代身心學。從肩頸的碰觸開始，撫慰平日蓄積的壓力，再透過輕彈、按壓與手指漫步等技巧，支持臉部神經系統、循環與肌肉組織。</p><div class="b-teacher" id="b-teacher"><div class="image"></div><div><h3>帶領者姓名與專業脈絡</h3><p class="body-copy">師資區以一張具意義的肖像和可閱讀的經歷為主。當沒有核准照片時，保留陶土色品牌表面，不用示意人像冒充真實教師。</p><p class="body-copy">此區可容納資格、教學經驗、方法源流與教師的一段核心引言。</p></div></div></div></section><section class="b-section b-curriculum" id="b-course"><div class="b-section__title"><h2 class="display">學習路徑</h2></div><div>${modules}</div></section><section class="b-video"><button class="b-video__button" type="button" disabled aria-label="課程影片尚未提供"></button><span class="b-video__status">課程影片待上架</span></section><section class="b-section b-audience" id="b-audience"><div class="b-section__title"><h2 class="display">這門課適合誰</h2></div><div><p class="body-copy">不需要按摩基礎。課程以大量親手操練，支持你把所學帶回日常或專業工作。</p><ul><li>對美與按摩感興趣，想學習一套完整手法的人</li><li>希望深化觸碰品質的美容師與身體工作者</li><li>想透過照顧他人，也練習與自己相處的人</li></ul></div></section>${supportSuite}</div></div><footer class="prototype-note"><strong>B｜雙域剖面</strong><span>優勢是訪客在任何深度都看得到關鍵資訊與報名入口；最適合單元繁多、日期複雜或有先修條件的培訓。風險是手機版需把固定欄改回文件流。</span></footer></article>`;

    const conceptC = `<article id="concept-c" class="concept c" role="tabpanel" aria-labelledby="tab-c" hidden>${header}<section class="c-hero"><div class="c-hero__top"><h1 class="display">日式回春<br>面部按摩</h1><div class="c-hero__copy"><p class="lede">以溫柔觸碰臉部，也重新遇見完整的自己。</p><p class="body-copy">一套融合日式護理、穴位與身心覺察的三階段學習。</p></div></div><nav class="c-path" aria-label="頁內內容地圖"><a href="#c-origin" aria-current="location">方法原點</a><a href="#c-touch">觸碰練習</a><a href="#c-teacher">帶領者</a><a href="#c-course">三階課程</a><a href="#c-share">學員分享</a><a href="#c-register">日期報名</a></nav></section><section class="c-meta"><div><strong>形式</strong><span>實體培訓</span></div><div><strong>課程結構</strong><span>三階段</span></div><div><strong>每日時間</strong><span>09:30–18:30</span></div><div><strong>地點</strong><span>高雄・普那生活空間</span></div></section><div class="c-atlas"><section class="c-block" id="c-origin">${imageA}<div class="c-block__copy"><div class="c-coordinate">METHOD・TOUCH・01</div><h2 class="display">從肩頸開始，把壓力慢慢放下。</h2><p class="body-copy">以輕彈、按壓與手指漫步等技巧，讓細緻的臉部肌肉不再承受過重力道。每個元件像一個座標：編輯者可以自由組合，但讀者仍知道自己在整體旅程中的位置。</p></div></section><section class="c-block" id="c-touch"><div class="c-block__copy"><div class="c-coordinate">PRACTICE・AWARENESS・02</div><h2 class="display">技巧之外，是碰觸的品質。</h2><p class="body-copy">90% 的課程時間是親手操練。練習不只為了記住步驟，也為了在接觸另一個人時，辨認自己的緊張、節奏與界線。</p></div>${imageB}</section><section class="c-block" id="c-teacher"><div class="image" aria-hidden="true"></div><div class="c-block__copy"><div class="c-coordinate">GUIDE・STORY・03</div><h2 class="display">帶領者姓名與完整專業脈絡</h2><p class="body-copy">教師模組容納姓名、資格、方法源流與生命經驗。正式肖像尚未核准時使用陶土品牌表面，避免以示意人像冒充真實師資。</p></div></section></div><section class="c-principles"><article class="c-principle"><h3>溫和</h3><p>對臉部組織保持細緻，不以更大力道換取效果。</p></article><article class="c-principle"><h3>臨在</h3><p>在操作中感覺自己，也讓接受碰觸的人保有安全與空間。</p></article><article class="c-principle"><h3>整合</h3><p>把面部、肩頸、頭部與內在狀態視為一個完整系統。</p></article></section><section class="c-timeline" id="c-course"><h2 class="display">三次深入，完成一套可實踐的方法。</h2><div class="c-timeline__track"><article class="c-timeline__item"><span>第一階</span><h3>初級面部按摩</h3><p class="body-copy">30 個面部技巧、頸前區按摩與淋巴引流。</p></article><article class="c-timeline__item"><span>第二階</span><h3>高級技巧與整合</h3><p class="body-copy">後頸、頭部與頭皮按摩，組成完整個案。</p></article><article class="c-timeline__item"><span>第三階</span><h3>指壓與能量激活</h3><p class="body-copy">認識經絡穴位與眼部、眉額指壓步驟。</p></article></div></section><section class="a-quote" id="c-share"><blockquote>「看似在外部工作，卻也在內心鬆綁。」</blockquote><cite>學員分享節錄・示意內容</cite></section>${supportSuite}<section class="c-register" id="c-register"><div class="c-register__copy"><h2 class="display">準備好，為自己留下一段完整的學習時間。</h2><p class="body-copy" style="color:#eaded4">日期、費用與報名連結為 CMS 必填的決策資訊；正式資料未確認時不顯示假價格或倒數。</p></div><div class="c-register__action"><p>杭州與高雄梯次內容為舊站版面示意。正式發布前須確認本期招生城市、日期、名額與報名狀態。</p><button class="primary" type="button" disabled><span>報名資訊待確認</span>${arrow}</button></div></section><footer class="prototype-note"><strong>C｜感知圖譜</strong><span>優勢是元件彈性最高，最能形成可重用的 Sanity 區塊系統，同時保留強烈品牌識別；風險是編輯規則要明確，避免模組排列失去節奏。</span></footer></article>`;

    document.querySelector('#concept-root').innerHTML = conceptA + conceptB + conceptC;
    document.querySelector('.a-hero__visual').insertAdjacentHTML('beforeend', '<div class="mobile-brief">溫柔觸碰，讓身體重新記得放鬆。<strong>實體培訓・報名資訊待確認</strong></div>');
    document.querySelector('.c-hero__copy').insertAdjacentHTML('beforeend', '<div class="mobile-brief">實體培訓・三階段<strong>報名資訊待確認</strong></div>');

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];
    function selectTab(tab, focus = false) {
      tabs.forEach((item) => {
        const active = item === tab;
        item.setAttribute('aria-selected', String(active));
        item.tabIndex = active ? 0 : -1;
      });
      panels.forEach((panel) => { panel.hidden = panel.id !== `concept-${tab.dataset.target}`; });
      history.replaceState(null, '', `?concept=${tab.dataset.target}`);
      window.scrollTo({ top: 0, behavior: 'instant' });
      if (focus) tab.focus();
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        const offset = event.key === 'ArrowRight' ? 1 : tabs.length - 1;
        selectTab(tabs[(index + offset) % tabs.length], true);
      });
    });
    document.querySelectorAll('.accordion__button').forEach((button) => {
      button.addEventListener('click', () => {
        const expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!expanded));
        button.nextElementSibling.hidden = expanded;
      });
    });
    const testimonialCopy = [
      ['「看似在外部工作，卻也在內心鬆綁。當我們慢下來，便能用一份寧靜去陪伴。」', '學員分享節錄・示意內容'],
      ['「面部放鬆時，全身也跟著放鬆。我開始理解，身體工作也可以是一種靜心。」', '學員分享節錄・示意內容'],
      ['「不是把人變好，而是讓人更平和地面對生命裡的好與不好。」', '學員分享節錄・示意內容'],
    ];
    document.querySelectorAll('[data-testimonials]').forEach((slider) => {
      let index = 0;
      const quote = slider.querySelector('blockquote');
      const cite = slider.querySelector('cite');
      const update = (offset) => {
        index = (index + offset + testimonialCopy.length) % testimonialCopy.length;
        [quote.textContent, cite.textContent] = testimonialCopy[index];
      };
      slider.querySelector('[data-testimonial-prev]').addEventListener('click', () => update(-1));
      slider.querySelector('[data-testimonial-next]').addEventListener('click', () => update(1));
    });
    document.querySelectorAll('.media-swiper__controls').forEach((controls) => {
      const track = controls.closest('.media-swiper')?.querySelector('[data-scroll-track]') || controls.parentElement.nextElementSibling;
      if (!track) return;
      const move = (direction) => track.scrollBy({ left: direction * track.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      controls.querySelector('[data-scroll-prev]').addEventListener('click', () => move(-1));
      controls.querySelector('[data-scroll-next]').addEventListener('click', () => move(1));
    });
    document.querySelectorAll('.a-chapters, .b-rail__nav, .c-path').forEach((navigation) => {
      const links = [...navigation.querySelectorAll('a[href^="#"]')];
      const sections = links.map((link) => document.querySelector(link.hash)).filter(Boolean);
      const observer = new IntersectionObserver((entries) => {
        const active = entries.filter((entry) => entry.isIntersecting).sort((left, right) => right.intersectionRatio - left.intersectionRatio)[0];
        if (!active) return;
        links.forEach((link) => {
          if (link.hash === `#${active.target.id}`) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }, { rootMargin: '-22% 0px -58% 0px', threshold: [0, .2, .5] });
      sections.forEach((section) => observer.observe(section));
    });
    const requested = new URLSearchParams(location.search).get('concept');
    const initial = tabs.find((tab) => tab.dataset.target === requested) || tabs[0];
    selectTab(initial);
  </script>
