<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>課程總覽｜高概念右側內容四案</title>
  <style>
    :root{--paper:#f8f5ef;--paper-deep:#eee5d8;--ink:#38342e;--muted:#766d63;--clay:#a46b54;--saffron:#f8bf4c;--oxblood:#392618;--persimmon:#df5b35;--warm-white:#f7f6f4;--line:rgba(57,38,24,.2);--header:87px;--control:76px;--edge:clamp(28px,5.7vw,110px);--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"BIZ UDPGothic","Noto Sans TC","PingFang TC",sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html{overflow-x:hidden;scroll-behavior:smooth;background:#d7cec0}body{min-width:0;margin:0;overflow-x:hidden;color:var(--ink);background:#d7cec0;font-family:var(--sans)}button,a{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}h1,h2,h3,p{margin-top:0}::selection{color:var(--warm-white);background:var(--persimmon)}:focus-visible{outline:2px solid var(--persimmon);outline-offset:5px}*{scrollbar-color:var(--clay) var(--paper);scrollbar-width:thin}
    .prototype{width:min(100%,1920px);margin:auto;background:var(--paper)}.chooser{position:sticky;z-index:200;top:0;display:flex;min-height:var(--control);align-items:center;justify-content:space-between;gap:24px;padding:10px var(--edge);color:var(--warm-white);background:rgba(37,24,15,.98);border-bottom:1px solid rgba(255,255,255,.18)}.chooser__title{font-size:12px;line-height:1.55;letter-spacing:.05em}.chooser__title small{display:block;color:#cdbdaf;font-size:10px;letter-spacing:.05em}.tabs{display:flex;gap:7px}.tabs button{min-height:44px;padding:0 16px;color:var(--warm-white);background:transparent;border:1px solid rgba(255,255,255,.3);font-size:11px;letter-spacing:.05em}.tabs button[aria-selected="true"]{color:var(--ink);background:var(--saffron);border-color:var(--saffron)}.concept[hidden]{display:none}
    .site-header{position:relative;z-index:30;display:flex;height:var(--header);align-items:center;justify-content:space-between;gap:32px;padding:0 var(--edge);background:rgba(248,245,239,.97);border-bottom:1px solid var(--line)}.logo{width:clamp(146px,15vw,190px)}.logo img{width:100%;height:auto}.site-nav{display:flex;align-items:center;gap:clamp(20px,2.5vw,42px);font-size:12px;font-weight:600;letter-spacing:.12em}.site-nav a{color:inherit;text-decoration:none}.site-nav a[aria-current="page"]{padding-bottom:8px;border-bottom:1px solid currentColor}
    .directory{display:grid;grid-template-columns:minmax(300px,35%) minmax(0,65%);align-items:start}.index{position:sticky;z-index:20;top:calc(var(--control) + var(--header));display:flex;height:calc(100svh - var(--control) - var(--header));min-height:570px;flex-direction:column;justify-content:space-between;gap:44px;padding:clamp(58px,6vw,94px) clamp(28px,3.2vw,58px) 38px;overflow-y:auto;color:var(--warm-white);background:var(--oxblood)}.index h1{margin:0;font-family:var(--serif);font-size:clamp(46px,4.8vw,76px);font-weight:400;line-height:1.28;letter-spacing:.04em}.index__prompt{max-width:12em;margin:24px 0 0;color:#e2d3c6;font-size:clamp(17px,1.4vw,22px);line-height:1.8;letter-spacing:.08em}.index ol{padding:0;margin:0;list-style:none}.index a{display:flex;min-height:56px;align-items:center;justify-content:space-between;gap:20px;color:#e2d3c6;border-bottom:1px solid rgba(247,246,244,.22);text-decoration:none;letter-spacing:.07em;transition:color 180ms ease}.index li:first-child a{color:var(--saffron);border-top:1px solid rgba(247,246,244,.22)}.index li:first-child a span:first-child:before{display:inline-block;width:7px;height:7px;margin-right:11px;background:currentColor;border-radius:50%;content:""}.count{font-size:11px;white-space:nowrap}.index__notice{margin:0;color:#bfae9f;font-size:9px;line-height:1.7;letter-spacing:.09em}.content{min-width:0}.mode{font-size:10px;font-weight:700;letter-spacing:.18em}.course-title,.group-title{font-family:var(--serif);font-weight:400}.arrow{position:relative;width:20px;height:20px;flex:0 0 20px}.arrow:before{position:absolute;top:3px;right:2px;width:11px;height:11px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;content:""}.arrow:after{position:absolute;top:10px;left:2px;width:15px;border-top:1.5px solid currentColor;transform:rotate(-45deg);content:""}.concept-note{display:flex;align-items:center;justify-content:space-between;gap:35px;padding:32px var(--edge);color:var(--warm-white);background:#281a12;border-top:1px solid rgba(255,255,255,.18);font-size:11px;line-height:1.8;letter-spacing:.08em}.concept-note strong{color:var(--saffron);font-weight:600}.concept-note span:last-child{max-width:52em;color:#cdbdaf;text-align:right}

    /* D — 折頁劇場 */
    .d .fold-group{padding:clamp(90px,10vw,160px) 0 0;border-bottom:1px solid var(--line)}.d .fold-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.75fr);align-items:end;gap:50px;padding:0 var(--edge) clamp(62px,7vw,105px)}.d .group-title{margin:0;font-size:clamp(62px,7.2vw,112px);line-height:1;letter-spacing:.04em}.d .fold-head p{max-width:28em;margin:0;color:var(--muted);font-size:13px;line-height:1.9}.d .fold-list{padding:0;margin:0;list-style:none;border-top:1px solid var(--line)}.d .fold-course{position:relative;display:grid;min-height:170px;grid-template-columns:minmax(0,1fr) 0;overflow:hidden;color:inherit;border-bottom:1px solid var(--line);text-decoration:none;transition:grid-template-columns 700ms var(--ease),background 300ms ease,color 300ms ease}.d .fold-copy{position:relative;z-index:2;display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;gap:25px;padding:28px var(--edge)}.d .fold-copy:before{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;content:attr(data-order)}.d .course-title{margin:0;font-size:clamp(29px,3.1vw,50px);line-height:1.35}.d .mode{position:absolute;top:26px;left:calc(var(--edge) + 113px);color:var(--clay);transform:translateY(-2px)}.d .fold-visual{min-width:0;height:100%;overflow:hidden}.d .fold-visual img{width:100%;height:100%;object-fit:cover;filter:saturate(.68);transform:scale(1.08);transition:transform 900ms var(--ease),filter 400ms ease}.d .fold-visual--empty{background:var(--saffron)}.d .fold-course:is(:hover,:focus-visible),.d .fold-list li:first-child .fold-course{grid-template-columns:minmax(0,1fr) minmax(260px,42%);color:var(--warm-white);background:var(--oxblood)}.d .fold-course:is(:hover,:focus-visible) .fold-visual img,.d .fold-list li:first-child .fold-visual img{filter:saturate(.9);transform:scale(1)}.d .fold-course:is(:hover,:focus-visible) .mode,.d .fold-course:is(:hover,:focus-visible) .fold-copy:before,.d .fold-list li:first-child .mode,.d .fold-list li:first-child .fold-copy:before{color:var(--saffron)}.d .fold-list:has(.fold-course:hover) li:first-child .fold-course:not(:hover){grid-template-columns:minmax(0,1fr) 0;color:inherit;background:transparent}.d .fold-list:has(.fold-course:hover) li:first-child .fold-course:not(:hover) .mode,.d .fold-list:has(.fold-course:hover) li:first-child .fold-course:not(:hover) .fold-copy:before{color:var(--clay)}

    @media(min-width:1024px){.d .fold-course{perspective:1400px}.d .fold-visual{position:relative;opacity:.35;transform:rotateY(-82deg);transform-origin:left center;transition:transform 760ms var(--ease),opacity 280ms ease}.d .fold-visual:before{position:absolute;z-index:2;top:0;bottom:0;left:0;width:36px;background:linear-gradient(90deg,rgba(37,24,15,.45),rgba(37,24,15,0));border-left:1px solid rgba(248,191,76,.72);content:"";pointer-events:none}.d .fold-visual:after{position:absolute;z-index:3;top:0;bottom:0;left:10px;border-left:1px solid rgba(247,246,244,.38);content:"";pointer-events:none}.d .fold-course:is(:hover,:focus-visible) .fold-visual,.d .fold-list li:first-child .fold-visual{opacity:1;transform:rotateY(0)}.d .fold-list:has(.fold-course:is(:hover,:focus-visible)) li:first-child .fold-course:not(:is(:hover,:focus-visible)){grid-template-columns:minmax(0,1fr) 0;color:inherit;background:transparent}.d .fold-list:has(.fold-course:is(:hover,:focus-visible)) li:first-child .fold-course:not(:is(:hover,:focus-visible)) .mode,.d .fold-list:has(.fold-course:is(:hover,:focus-visible)) li:first-child .fold-course:not(:is(:hover,:focus-visible)) .fold-copy:before{color:var(--clay)}.d .fold-list:has(.fold-course:is(:hover,:focus-visible)) li:first-child .fold-course:not(:is(:hover,:focus-visible)) .fold-visual{opacity:.35;transform:rotateY(-82deg)}}

    /* E — 感知譜線 */
    .e .content{position:relative;overflow:hidden;background:#f1e9dd}.e .score-group{position:relative;min-height:880px;padding:clamp(95px,10vw,150px) var(--edge);border-bottom:1px solid var(--line);isolation:isolate}.e .score-head{position:relative;z-index:4;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,.8fr);align-items:start;gap:50px}.e .group-title{max-width:4em;margin:0;font-size:clamp(68px,8vw,124px);line-height:1.08;letter-spacing:.06em}.e .score-head p{max-width:28em;margin:18px 0 0;color:var(--muted);font-size:13px;line-height:1.95}.e .score-path{position:absolute;z-index:-1;inset:18% -9% 5% 0;width:118%;height:78%;fill:none;stroke:rgba(164,107,84,.52);stroke-width:1.2;stroke-dasharray:1400;stroke-dashoffset:0}.e .score-courses{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:24px;min-height:510px;padding:110px 0 0;margin:0;list-style:none}.e .score-courses li:nth-child(2){align-self:start;margin-top:135px}.e .score-courses li:nth-child(3){align-self:center;margin-top:190px}.e .score-course{display:flex;min-height:170px;flex-direction:column;justify-content:space-between;padding:24px 0;color:inherit;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);text-decoration:none;transition:color 240ms ease,transform 500ms var(--ease)}.e .score-course:before{width:13px;height:13px;margin-top:-31px;background:var(--saffron);border:4px solid var(--paper);border-radius:50%;box-shadow:0 0 0 1px var(--clay);content:""}.e .course-title{margin:42px 0 24px;font-size:clamp(25px,2.6vw,40px);line-height:1.45}.e .score-meta{display:flex;align-items:center;justify-content:space-between;color:var(--clay)}.e .score-course:is(:hover,:focus-visible){color:var(--persimmon);transform:translateY(-12px)}
    @supports(animation-timeline:view()){.e .score-path{stroke-dashoffset:1400;animation:draw-score 1s linear both;animation-timeline:view();animation-range:entry 10% cover 70%}@keyframes draw-score{to{stroke-dashoffset:0}}}

    /* F — 光片長鏡 */
    .f .content{color:var(--warm-white);background:#241710}.f .film-group{position:relative;min-height:100svh;padding:clamp(72px,8vw,120px) clamp(28px,4vw,72px);overflow:hidden;border-bottom:1px solid rgba(255,255,255,.18);isolation:isolate}.f .film-head{position:relative;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;gap:50px}.f .group-title{max-width:5em;margin:0;font-size:clamp(60px,7vw,108px);line-height:1.05;letter-spacing:.05em}.f .film-head p{max-width:25em;margin:12px 0 0;color:#d8c7b8;font-size:12px;line-height:1.9}.f .film-list{position:relative;z-index:3;display:flex;min-height:590px;align-items:flex-end;gap:18px;padding:120px 0 0;margin:0;list-style:none}.f .film-list li{min-width:0;flex:1;transition:flex 750ms var(--ease)}.f .film-list li:has(.film-course:hover),.f .film-list li:has(.film-course:focus-visible){flex:2.2}.f .film-course{position:relative;display:flex;height:430px;flex-direction:column;justify-content:flex-end;overflow:hidden;color:var(--warm-white);background:#352319;text-decoration:none}.f .film-visual{position:absolute;inset:0;overflow:hidden}.f .film-visual:after{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(25,15,9,.9) 100%);content:""}.f .film-visual img{width:100%;height:100%;object-fit:cover;filter:saturate(.58) brightness(.8);transform:scale(1.04);transition:filter 500ms ease,transform 900ms var(--ease)}.f .film-visual--empty{background:var(--clay)}.f .film-copy{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;align-items:end;gap:22px;padding:28px}.f .mode{grid-column:1/-1;color:var(--saffron)}.f .course-title{margin:0;font-size:clamp(24px,2.7vw,42px);line-height:1.35}.f .film-course:is(:hover,:focus-visible) img{filter:saturate(.85) brightness(.9);transform:scale(1)}.f .film-course:is(:hover,:focus-visible) .arrow{transform:translate(6px,-6px)}.f .arrow{transition:transform 300ms var(--ease)}

    /* G — 直排卷冊 */
    .g .content{background:#eadfce}.g .scroll-group{position:relative;display:grid;min-height:760px;grid-template-columns:110px minmax(0,1fr);border-bottom:1px solid rgba(57,38,24,.24)}.g .scroll-head{display:flex;align-items:flex-start;justify-content:center;padding:78px 26px;background:var(--saffron);border-right:1px solid rgba(57,38,24,.24)}.g .group-title{margin:0;font-size:clamp(38px,4.2vw,66px);line-height:1.25;letter-spacing:.18em;writing-mode:vertical-rl}.g .scroll-body{position:relative;display:flex;min-width:0;flex-direction:column;justify-content:space-between;padding:clamp(68px,8vw,120px) clamp(32px,4.5vw,82px)}.g .scroll-body>p{max-width:31em;margin:0 0 68px auto;color:var(--muted);font-size:12px;line-height:2}.g .scroll-list{display:flex;min-height:430px;align-items:stretch;justify-content:flex-start;gap:clamp(34px,5vw,84px);padding:0;margin:0;list-style:none}.g .scroll-list li{display:flex}.g .scroll-course{display:grid;grid-template-rows:1fr auto;gap:28px;min-width:118px;color:inherit;text-decoration:none}.g .scroll-title-wrap{display:flex;align-items:flex-start;gap:18px}.g .course-title{margin:0;font-size:clamp(28px,3vw,45px);line-height:1.45;letter-spacing:.12em;writing-mode:vertical-rl}.g .mode{color:var(--clay);writing-mode:vertical-rl}.g .scroll-mark{position:relative;display:flex;width:100%;height:68px;align-items:center;border-top:1px solid var(--ink);overflow:hidden}.g .scroll-mark:before{width:12px;height:12px;background:var(--persimmon);border-radius:50%;content:"";transition:transform 550ms var(--ease)}.g .scroll-mark .arrow{margin-left:auto}.g .scroll-course:is(:hover,:focus-visible) .scroll-mark:before{transform:translateX(calc(100% + 58px)) scale(1.45)}.g .scroll-course:is(:hover,:focus-visible) .course-title{color:var(--persimmon)}

    @media(max-width:1180px) and (min-width:1024px){.d .fold-copy{grid-template-columns:55px minmax(0,1fr) auto}.d .mode{left:calc(var(--edge) + 80px)}.e .score-courses{grid-template-columns:1fr}.e .score-courses li:nth-child(n){align-self:auto;margin:0}.e .score-group{min-height:1050px}.f .film-list{flex-direction:column;padding-top:80px}.f .film-list li,.f .film-list li:has(.film-course:hover){width:100%;flex:auto}.f .film-course{height:300px}}
    @media(max-width:1023px){:root{--control:112px}.chooser{align-items:flex-start;flex-direction:column;gap:9px;padding-block:12px}.tabs{width:100%}.tabs button{min-width:0;flex:1 1 0;overflow:hidden;padding:0 3px;font-size:9px;letter-spacing:.02em;white-space:nowrap}.site-nav{display:none}.directory{grid-template-columns:1fr}.index{position:relative;top:auto;height:auto;min-height:560px}.concept-note{align-items:flex-start;flex-direction:column}.concept-note span:last-child{text-align:left}.d .fold-head,.e .score-head{grid-template-columns:1fr}.d .fold-course,.d .fold-course:is(:hover,:focus-visible),.d .fold-list li:first-child .fold-course,.d .fold-list:has(.fold-course:hover) li:first-child .fold-course:not(:hover){grid-template-columns:1fr}.d .fold-copy{grid-template-columns:38px minmax(0,1fr) auto;padding-block:36px}.d .mode{position:static;grid-column:2/-1;grid-row:1}.d .fold-copy:before{grid-row:1/3}.d .fold-visual{height:250px;order:-1}.e .score-group{min-height:auto}.e .score-courses{grid-template-columns:1fr;gap:48px;min-height:0;padding-top:100px}.e .score-courses li:nth-child(n){align-self:auto;margin:0}.e .score-path{inset:25% -40% 5% 18%;width:120%;height:65%}.f .film-group{min-height:auto;padding-block:90px}.f .film-head{flex-direction:column}.f .film-list{min-height:0;flex-direction:column;padding-top:75px}.f .film-list li,.f .film-list li:has(.film-course:hover){width:100%;flex:auto}.f .film-course{height:430px}.g .scroll-group{min-height:0;grid-template-columns:76px minmax(0,1fr)}.g .scroll-head{padding:62px 18px}.g .scroll-list{min-height:390px;gap:36px;overflow-x:auto;padding-bottom:24px}.g .scroll-course{min-width:100px}}
    @media(max-width:560px){.site-header{height:78px}.logo{width:145px}.index{min-height:540px;padding-block:70px 38px}.d .group-title,.e .group-title,.f .group-title{font-size:52px}.d .fold-head{padding-bottom:72px}.d .fold-copy{gap:14px}.d .course-title{font-size:29px}.e .score-head{gap:24px}.e .score-course{min-height:155px}.f .film-course{height:360px}.g .scroll-group{grid-template-columns:60px minmax(0,1fr)}.g .scroll-body{padding-inline:24px}.g .scroll-list{gap:28px}.g .course-title{font-size:28px}}
    .index__prompt,.index a{letter-spacing:.05em}.index__notice{font-size:10px;letter-spacing:.05em}.mode{font-size:11px;letter-spacing:.12em}.concept-note{font-size:12px;letter-spacing:.05em}
    @media(max-width:1023px){.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}.tabs button{width:100%;font-size:11px;letter-spacing:0}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fold-course,.fold-visual,.fold-visual img,.score-course,.film-list li,.film-visual img,.arrow,.scroll-mark:before{transition:none!important}.e .score-path{animation:none!important;stroke-dashoffset:0!important}}
  </style>
</head>
<body>
  <div class="prototype">
    <header class="chooser">
      <div class="chooser__title">課程總覽・高概念右側內容四案<small>固定 Header、左側目錄與內容真實性；只放大右欄的空間、節奏與互動</small></div>
      <div class="tabs" role="tablist" aria-label="選擇高概念右側設計">
        <button id="tab-d" role="tab" aria-controls="concept-d" aria-selected="true" data-target="d">D　折頁</button>
        <button id="tab-e" role="tab" aria-controls="concept-e" aria-selected="false" data-target="e" tabindex="-1">E　譜線</button>
        <button id="tab-f" role="tab" aria-controls="concept-f" aria-selected="false" data-target="f" tabindex="-1">F　長鏡</button>
        <button id="tab-g" role="tab" aria-controls="concept-g" aria-selected="false" data-target="g" tabindex="-1">G　卷冊</button>
      </div>
    </header>
    <main id="concept-root"></main>
  </div>
  <script>
    history.scrollRestoration='manual';scrollTo(0,0);
    const categories=[
      {id:'body',name:'愛身體',summary:'從有意識的碰觸與覺察出發，練習聆聽身體，也重新辨認自己的界線。',courses:[['頭薦骨','實體','../../public/images/home-banner-2.jpg'],['再平衡按摩','實體',''],['日式臉部按摩','實體','../../public/images/home-banner.jpg']]},
      {id:'heart',name:'撫慰心',summary:'透過關係與依附經驗的理解，為內在感受留出能被看見與承接的空間。',courses:[['童年依附創傷療癒','實體・線上','../../public/images/home-banner-2.jpg']]},
      {id:'life',name:'究生命',summary:'藉由理解工具觀察生命裡反覆出現的節奏，整理當下的位置與可能方向。',courses:[['人類圖','線上','']]},
      {id:'beauty',name:'展現美',summary:'在顏色、形狀與創作的過程中安住，讓美感成為回到當下的一條路。',courses:[['曼陀羅靜心彩繪','線上','../../public/images/home-banner.jpg']]}
    ];
    const header=`<header class="site-header"><a class="logo" href="#"><img src="../../public/assets/logo-main.png" alt="普那生活空間"></a><nav class="site-nav" aria-label="主要選單"><a href="#">近期課程</a><a href="#" aria-current="page">課程探索</a><a href="#">文章分享</a><a href="#">個案諮詢</a></nav></header>`;
    const courseIndex=(key)=>`<aside class="index"><div><h1>課程探索</h1><p class="index__prompt">想從哪裡開始？</p></div><nav aria-label="課程分類"><ol>${categories.map((category,i)=>`<li><a href="#${key}-${category.id}"><span>${category.name}</span><span class="count">${i===0?'目前　':''}${category.courses.length} 門</span></a></li>`).join('')}</ol></nav><p class="index__notice">分類簡介與影像為版面示意，正式內容待確認。</p></aside>`;
    const arrow=`<span class="arrow" aria-hidden="true"></span>`;
    const image=(src,cls)=>src?`<span class="${cls}"><img src="${src}" alt="" width="960" height="640"></span>`:`<span class="${cls} ${cls}--empty" aria-hidden="true"></span>`;
    const dGroup=(category)=>`<section id="d-${category.id}" class="fold-group"><div class="fold-head"><h2 class="group-title">${category.name}</h2><p>${category.summary}</p></div><ol class="fold-list">${category.courses.map((course,i)=>`<li><a class="fold-course" href="#"><span class="fold-copy" data-order="0${i+1}"><span class="mode">${course[1]}</span><h3 class="course-title">${course[0]}</h3>${arrow}</span>${image(course[2],'fold-visual')}</a></li>`).join('')}</ol></section>`;
    const path=`<svg class="score-path" viewBox="0 0 900 520" preserveAspectRatio="none" aria-hidden="true"><path d="M-40 390 C 145 85, 275 485, 430 250 S 710 40, 960 310"/></svg>`;
    const eGroup=(category)=>`<section id="e-${category.id}" class="score-group"><div class="score-head"><h2 class="group-title">${category.name}</h2><p>${category.summary}</p></div>${path}<ol class="score-courses">${category.courses.map(course=>`<li><a class="score-course" href="#"><h3 class="course-title">${course[0]}</h3><span class="score-meta"><span class="mode">${course[1]}</span>${arrow}</span></a></li>`).join('')}</ol></section>`;
    const fGroup=(category)=>`<section id="f-${category.id}" class="film-group"><div class="film-head"><h2 class="group-title">${category.name}</h2><p>${category.summary}</p></div><ol class="film-list">${category.courses.map(course=>`<li><a class="film-course" href="#">${image(course[2],'film-visual')}<span class="film-copy"><span class="mode">${course[1]}</span><h3 class="course-title">${course[0]}</h3>${arrow}</span></a></li>`).join('')}</ol></section>`;
    const gGroup=(category)=>`<section id="g-${category.id}" class="scroll-group"><header class="scroll-head"><h2 class="group-title">${category.name}</h2></header><div class="scroll-body"><p>${category.summary}</p><ol class="scroll-list">${category.courses.map(course=>`<li><a class="scroll-course" href="#"><span class="scroll-title-wrap"><span class="mode">${course[1]}</span><h3 class="course-title">${course[0]}</h3></span><span class="scroll-mark">${arrow}</span></a></li>`).join('')}</ol></div></section>`;
    const renders={d:dGroup,e:eGroup,f:fGroup,g:gGroup};const notes={d:['D｜折頁劇場','課程名稱先保持純粹；游標或鍵盤進入時，該列像紙頁打開，影像只在選擇當下出現。'],e:['E｜感知譜線','閱讀路徑本身成為畫面：線條隨捲動完成，課程像停靠點，但文字與連結始終保持原生可用。'],f:['F｜光片長鏡','每個分類是一幕、每門課是一片可展開的光片；影像與大字共同建立最強烈的沉浸節奏。'],g:['G｜直排卷冊','中文直排不再只是裝飾，而是讓分類與課名像卷冊展開；橫向節奏只留在右欄內部。']};
    const requested=new URLSearchParams(location.search).get('panel');const initialKey=['d','e','f','g'].includes(requested)?requested:'d';
    document.querySelector('#concept-root').innerHTML=['d','e','f','g'].map(key=>`<article id="concept-${key}" class="concept ${key}" role="tabpanel" aria-labelledby="tab-${key}" ${key===initialKey?'':'hidden'}>${header}<div class="directory">${courseIndex(key)}<div class="content">${categories.map(renders[key]).join('')}</div></div><footer class="concept-note"><strong>${notes[key][0]}</strong><span>${notes[key][1]}</span></footer></article>`).join('');
    const tabs=[...document.querySelectorAll('[role="tab"]')];const panels=[...document.querySelectorAll('[role="tabpanel"]')];function select(tab,focus=false,reset=true){tabs.forEach(item=>{const active=item===tab;item.setAttribute('aria-selected',String(active));item.tabIndex=active?0:-1});panels.forEach(panel=>panel.hidden=panel.id!==`concept-${tab.dataset.target}`);if(reset){history.replaceState(null,'',`?panel=${tab.dataset.target}`);scrollTo({top:0,behavior:'instant'})}if(focus)tab.focus()}
    tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();select(tabs[(i+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length],true)}})});select(tabs.find(tab=>tab.dataset.target===initialKey),false,false);requestAnimationFrame(()=>scrollTo(0,0));
  </script>
</body>
</html>
