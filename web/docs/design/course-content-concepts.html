<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>課程總覽｜右側內容三案</title>
  <style>
    :root{--paper:#f8f5ef;--paper-deep:#eee5d8;--ink:#38342e;--muted:#81776a;--clay:#a46b54;--saffron:#f8bf4c;--oxblood:#392618;--persimmon:#df5b35;--warm-white:#f7f6f4;--line:rgba(57,38,24,.2);--header:87px;--control:72px;--edge:clamp(28px,5.7vw,110px);--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"BIZ UDPGothic","Noto Sans TC","PingFang TC",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:#d8cfc1}body{margin:0;color:var(--ink);background:#d8cfc1;font-family:var(--sans)}button,a{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}h1,h2,h3,p{margin-top:0}p{line-height:1.9}::selection{color:var(--warm-white);background:var(--persimmon)}:focus-visible{outline:2px solid var(--clay);outline-offset:5px}
    .prototype{width:min(100%,1920px);margin:auto;background:var(--paper)}.chooser{position:sticky;z-index:100;top:0;display:flex;min-height:var(--control);align-items:center;justify-content:space-between;gap:24px;padding:10px var(--edge);color:var(--warm-white);background:rgba(39,25,16,.97);border-bottom:1px solid rgba(255,255,255,.18)}.chooser__title{font-size:12px;line-height:1.55;letter-spacing:.13em}.chooser__title small{display:block;color:#cdbdaf;font-size:9px;letter-spacing:.1em}.tabs{display:flex;gap:7px}.tabs button{min-height:44px;padding:0 18px;color:var(--warm-white);background:transparent;border:1px solid rgba(255,255,255,.3);font-size:11px;letter-spacing:.08em}.tabs button[aria-selected="true"]{color:var(--ink);background:var(--saffron);border-color:var(--saffron)}.concept[hidden]{display:none}
    .site-header{display:flex;height:var(--header);align-items:center;justify-content:space-between;gap:32px;padding:0 var(--edge);background:rgba(248,245,239,.96);border-bottom:1px solid var(--line)}.logo{width:clamp(146px,15vw,190px)}.logo img{width:100%;height:auto}.site-nav{display:flex;align-items:center;gap:clamp(20px,2.5vw,42px);font-size:12px;font-weight:600;letter-spacing:.12em}.site-nav a{color:inherit;text-decoration:none}.site-nav a[aria-current="page"]{padding-bottom:8px;border-bottom:1px solid var(--ink)}
    .directory{display:grid;grid-template-columns:minmax(300px,35%) minmax(0,65%);align-items:start}.index{position:sticky;top:calc(var(--control) + var(--header));display:flex;height:calc(100svh - var(--control) - var(--header));min-height:590px;flex-direction:column;justify-content:space-between;gap:48px;padding:clamp(64px,7vw,112px) clamp(28px,3.2vw,58px) 42px;overflow-y:auto;color:var(--warm-white);background:var(--oxblood)}.index h1{margin:0;font-family:var(--serif);font-size:clamp(46px,4.8vw,76px);font-weight:400;line-height:1.28;letter-spacing:.04em}.index__prompt{max-width:12em;margin:28px 0 0;color:#e2d3c6;font-size:clamp(17px,1.4vw,22px);line-height:1.8;letter-spacing:.08em}.index ol{padding:0;margin:0;list-style:none}.index a{display:flex;min-height:58px;align-items:center;justify-content:space-between;gap:20px;color:#e2d3c6;border-bottom:1px solid rgba(247,246,244,.22);text-decoration:none;letter-spacing:.07em}.index li:first-child a{color:var(--saffron);border-top:1px solid rgba(247,246,244,.22)}.index li:first-child a span:first-child:before{display:inline-block;width:7px;height:7px;margin-right:11px;background:currentColor;border-radius:50%;content:""}.count{font-size:12px;white-space:nowrap}.index__notice{margin:0;color:#bfae9f;font-size:10px;line-height:1.7;letter-spacing:.09em}.content{min-width:0}.group{scroll-margin-top:calc(var(--control) + var(--header));border-bottom:1px solid var(--line)}.group:last-child{border-bottom:0}.group h2,.course-title{font-family:var(--serif);font-weight:400}.mode{font-size:10px;font-weight:600;letter-spacing:.17em}.arrow{position:relative;width:19px;height:19px;flex:0 0 19px}.arrow:before{position:absolute;top:3px;right:2px;width:11px;height:11px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;content:""}.arrow:after{position:absolute;top:10px;left:2px;width:15px;border-top:1.5px solid currentColor;transform:rotate(-45deg);content:""}.empty-visual{background:var(--paper-deep)}.empty-visual:after{display:block;width:30%;height:1px;margin:auto;background:rgba(57,38,24,.25);content:""}

    /* A — 編輯目錄：安靜、逐列閱讀 */
    .a .content{padding:0 var(--edge)}.a .group{padding:clamp(92px,10vw,160px) 0}.a .group-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,.85fr);align-items:end;gap:56px;margin-bottom:70px}.a .group h2{margin:0;font-size:clamp(48px,5.3vw,82px);line-height:1.25;letter-spacing:.06em}.a .group-head p{margin:0;color:var(--muted);font-size:14px}.a .courses{padding:0;margin:0;list-style:none}.a .course{display:grid;min-height:235px;grid-template-columns:minmax(0,1fr) minmax(200px,34%);align-items:center;gap:42px;padding:32px 0;color:inherit;border-top:1px solid var(--line);text-decoration:none}.a li:last-child .course{border-bottom:1px solid var(--line)}.a .course-copy{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}.a .mode{grid-column:1/-1;color:var(--clay)}.a .course-title{margin:0;font-size:clamp(25px,2.5vw,42px);line-height:1.45}.a .course-visual{height:170px;overflow:hidden}.a .course-visual img{width:100%;height:100%;object-fit:cover;filter:saturate(.72);transition:transform .8s cubic-bezier(.16,1,.3,1)}.a .course:hover img{transform:scale(1.035)}

    /* B — 影像畫冊：由課程場景帶入，再讀資訊 */
    .b .group{padding:clamp(84px,9vw,145px) var(--edge)}.b .group-head{display:flex;align-items:flex-end;justify-content:space-between;gap:55px;margin-bottom:54px}.b .group h2{margin:0;font-size:clamp(54px,6vw,94px);line-height:1.12;letter-spacing:.05em}.b .group-head p{max-width:25em;margin:0;color:var(--muted);font-size:13px}.b .courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:54px 24px;padding:0;margin:0;list-style:none}.b .courses li:first-child:nth-last-child(n+2){grid-column:1/-1}.b .courses li:first-child:nth-last-child(n+2) .course{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(230px,.55fr);align-items:stretch}.b .courses li:first-child:nth-last-child(n+2) .course-visual{min-height:390px}.b .courses li:first-child:nth-last-child(n+2) .course-copy{display:flex;min-height:390px;flex-direction:column;justify-content:flex-end;padding:38px;background:var(--paper-deep);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.b .course{display:flex;height:100%;flex-direction:column;color:inherit;text-decoration:none}.b .course-visual{height:220px;overflow:hidden;order:-1}.b .course-visual img{width:100%;height:100%;object-fit:cover;filter:saturate(.76);transition:transform .8s cubic-bezier(.16,1,.3,1)}.b .course-copy{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;min-height:130px;padding:24px 0;border-bottom:1px solid var(--line)}.b .mode{grid-column:1/-1;color:var(--clay)}.b .course-title{margin:0;font-size:clamp(22px,2.2vw,34px);line-height:1.5}.b .course:hover img{transform:scale(1.035)}

    /* C — 課程索引：資訊密度高、便於快速比較 */
    .c .content{padding:0 clamp(28px,4.5vw,84px)}.c .group{display:grid;grid-template-columns:minmax(150px,25%) minmax(0,75%);gap:clamp(30px,4vw,72px);padding:clamp(84px,9vw,140px) 0}.c .group-head{align-self:start}.c .group h2{margin:0 0 32px;font-size:clamp(42px,4.5vw,70px);line-height:1.3;letter-spacing:.05em}.c .group-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.9}.c .courses{padding:0;margin:0;counter-reset:course;list-style:none;border-top:1px solid var(--ink)}.c .courses li{counter-increment:course}.c .course{display:grid;min-height:122px;grid-template-columns:34px minmax(0,1fr) auto 62px;align-items:center;gap:20px;color:inherit;border-bottom:1px solid var(--line);text-decoration:none}.c .course:before{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;content:counter(course,decimal-leading-zero)}.c .course-title{margin:0;font-size:clamp(24px,2.45vw,38px);line-height:1.42}.c .mode{color:var(--clay);white-space:nowrap}.c .course-visual{width:62px;height:78px;overflow:hidden}.c .course-visual img{width:100%;height:100%;object-fit:cover;filter:saturate(.65)}.c .empty-visual{display:grid;place-items:center}.c .arrow{display:none}

    .concept-note{display:flex;align-items:center;justify-content:space-between;gap:35px;padding:34px var(--edge);color:var(--warm-white);background:#2b1c13;border-top:1px solid rgba(255,255,255,.18);font-size:11px;line-height:1.8;letter-spacing:.08em}.concept-note strong{color:var(--saffron);font-weight:600}.concept-note span:last-child{color:#cdbdaf;text-align:right}
    @media(max-width:1023px){:root{--control:106px}.chooser{align-items:flex-start;flex-direction:column;gap:9px;padding-block:12px}.tabs{width:100%}.tabs button{min-width:0;flex:1 1 0;overflow:hidden;padding:0 3px;font-size:10px;letter-spacing:.03em;white-space:nowrap}.site-nav{display:none}.directory{grid-template-columns:1fr}.index{position:relative;top:auto;height:auto;min-height:570px}.a .content,.c .content{padding-inline:var(--edge)}.a .group,.b .group,.c .group{padding-block:105px}.a .group-head,.c .group{grid-template-columns:1fr}.a .group-head{gap:30px;margin-bottom:58px}.a .course{grid-template-columns:1fr;gap:25px;padding-block:36px}.a .course-visual{height:250px;order:-1}.b .group-head{align-items:flex-start;flex-direction:column;gap:26px}.b .courses,.b .courses li:first-child:nth-last-child(n+2) .course{grid-template-columns:1fr}.b .courses li:first-child:nth-last-child(n+2){grid-column:auto}.b .courses li:first-child:nth-last-child(n+2) .course-visual{min-height:260px}.b .courses li:first-child:nth-last-child(n+2) .course-copy{min-height:130px;padding:24px 0;background:transparent}.b .course-visual{height:260px}.c .group{gap:45px}.concept-note{align-items:flex-start;flex-direction:column}.concept-note span:last-child{text-align:left}}
    @media(max-width:560px){.site-header{height:78px}.logo{width:145px}.index{min-height:540px;padding-block:70px 38px}.a .group h2,.b .group h2,.c .group h2{font-size:46px}.b .courses{grid-template-columns:1fr}.c .course{min-height:132px;grid-template-columns:26px minmax(0,1fr) 50px;gap:13px}.c .mode{grid-column:2}.c .course-visual{grid-column:3;grid-row:1/3;width:50px;height:68px}.a .course-visual,.b .course-visual{height:230px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.course-visual img{transition:none!important}}
  </style>
</head>
<body>
  <div class="prototype">
    <header class="chooser">
      <div class="chooser__title">課程總覽・右側內容三案<small>左側目錄與共用 Header 固定；本輪只比較課程內容的閱讀方式</small></div>
      <div class="tabs" role="tablist" aria-label="選擇右側內容設計">
        <button id="tab-a" role="tab" aria-controls="concept-a" aria-selected="true" data-target="a">A　編輯目錄</button>
        <button id="tab-b" role="tab" aria-controls="concept-b" aria-selected="false" data-target="b" tabindex="-1">B　影像畫冊</button>
        <button id="tab-c" role="tab" aria-controls="concept-c" aria-selected="false" data-target="c" tabindex="-1">C　課程索引</button>
      </div>
    </header>
    <main id="concept-root"></main>
  </div>
  <script>
    const categories=[
      {id:'body',name:'愛身體',summary:'從有意識的碰觸與覺察出發，練習聆聽身體，也重新辨認自己的界線。',courses:[['頭薦骨','實體','../../public/images/home-banner-2.jpg'],['再平衡按摩','實體',''],['日式臉部按摩','實體','../../public/images/home-banner.jpg']]},
      {id:'heart',name:'撫慰心',summary:'透過關係與依附經驗的理解，為內在感受留出能被看見與承接的空間。',courses:[['童年依附創傷療癒','實體・線上','../../public/images/home-banner-2.jpg']]},
      {id:'life',name:'究生命',summary:'藉由理解工具觀察生命裡反覆出現的節奏，整理當下的位置與可能方向。',courses:[['人類圖','線上','']]},
      {id:'beauty',name:'展現美',summary:'在顏色、形狀與創作的過程中安住，讓美感成為回到當下的一條路。',courses:[['曼陀羅靜心彩繪','線上','../../public/images/home-banner.jpg']]}
    ];
    const visual=(src,title)=>src?`<span class="course-visual"><img src="${src}" alt="" width="640" height="426"></span>`:`<span class="course-visual empty-visual" aria-hidden="true"></span>`;
    const group=(category,key)=>`<section id="${key}-${category.id}" class="group"><div class="group-head"><h2>${category.name}</h2><p>${category.summary}</p></div><ol class="courses">${category.courses.map(course=>`<li><a class="course" href="#"><span class="course-copy"><span class="mode">${course[1]}</span><h3 class="course-title">${course[0]}</h3><span class="arrow" aria-hidden="true"></span></span>${visual(course[2],course[0])}</a></li>`).join('')}</ol></section>`;
    const header=`<header class="site-header"><a class="logo" href="#"><img src="../../public/assets/logo-main.png" alt="普那生活空間"></a><nav class="site-nav" aria-label="主要選單"><a href="#">近期課程</a><a href="#" aria-current="page">課程探索</a><a href="#">文章分享</a><a href="#">個案諮詢</a></nav></header>`;
    const courseIndex=(key)=>`<aside class="index"><div><h1>課程探索</h1><p class="index__prompt">想從哪裡開始？</p></div><nav aria-label="課程分類"><ol>${categories.map((category,i)=>`<li><a href="#${key}-${category.id}"><span>${category.name}</span><span class="count">${i===0?'目前　':''}${category.courses.length} 門</span></a></li>`).join('')}</ol></nav><p class="index__notice">分類簡介與影像為版面示意，正式內容待確認。</p></aside>`;
    const notes={a:['A｜編輯目錄','保留充足留白與橫向課程列，適合逐組理解分類，節奏最接近目前實作。'],b:['B｜影像畫冊','以首門課的大幅場景建立感受，其餘課程形成畫冊節奏，品牌氛圍最強。'],c:['C｜課程索引','分類說明固定在側邊，課名、形式與縮圖密集排列，最快速完成跨課程比較。']};
    const requested=new URLSearchParams(location.search).get('panel');const initialKey=['a','b','c'].includes(requested)?requested:'a';
    document.querySelector('#concept-root').innerHTML=['a','b','c'].map(key=>`<article id="concept-${key}" class="concept ${key}" role="tabpanel" aria-labelledby="tab-${key}" ${key===initialKey?'':'hidden'}>${header}<div class="directory">${courseIndex(key)}<div class="content">${categories.map(category=>group(category,key)).join('')}</div></div><footer class="concept-note"><strong>${notes[key][0]}</strong><span>${notes[key][1]}</span></footer></article>`).join('');
    const tabs=[...document.querySelectorAll('[role="tab"]')];const panels=[...document.querySelectorAll('[role="tabpanel"]')];function select(tab,focus=false,reset=true){tabs.forEach(item=>{const active=item===tab;item.setAttribute('aria-selected',String(active));item.tabIndex=active?0:-1});panels.forEach(panel=>panel.hidden=panel.id!==`concept-${tab.dataset.target}`);if(reset){history.replaceState(null,'',`?panel=${tab.dataset.target}`);scrollTo({top:0,behavior:'instant'})}if(focus)tab.focus()}
    tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();select(tabs[(i+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length],true)}})});select(tabs.find(tab=>tab.dataset.target===initialKey),false,false);
  </script>
</body>
</html>
