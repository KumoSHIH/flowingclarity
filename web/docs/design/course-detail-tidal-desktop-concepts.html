<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>章節潮汐｜桌機版三款設計稿</title>
  <style>
    @font-face {
      font-family: "Flowing Serif";
      src: url("../../public/fonts/NotoSerifTC-Variable.ttf") format("truetype");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --paper: #f8f5ef;
      --sand: #e8dfd2;
      --ink: #38342e;
      --muted: #756b60;
      --clay: #a46b54;
      --saffron: #f8bf4c;
      --oxblood: #392618;
      --night: #241710;
      --bark: #766254;
      --persimmon: #df5b35;
      --warm-white: #f7f6f4;
      --line: rgba(57, 38, 24, .2);
      --edge: clamp(64px, 6vw, 116px);
      --serif: "Flowing Serif", serif;
      --sans: "BIZ UDPGothic", "Noto Sans TC", "PingFang TC", sans-serif;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --chooser: 78px;
    }

    * { box-sizing: border-box; }
    html { min-width: 1180px; scroll-behavior: smooth; background: #cfc4b8; }
    body { min-width: 1180px; margin: 0; color: var(--ink); background: #cfc4b8; font-family: var(--sans); }
    button, a { color: inherit; font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    a { text-underline-offset: .3em; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    h1, h2, h3, p, blockquote { margin-top: 0; }
    ::selection { color: var(--warm-white); background: var(--persimmon); }
    :focus-visible { outline: 2px solid var(--persimmon); outline-offset: 5px; }
    * { scrollbar-color: var(--clay) var(--paper); scrollbar-width: thin; }

    .desktop-note { display: none; }
    .prototype { width: min(100%, 1920px); margin: 0 auto; background: var(--paper); }
    .concept[hidden] { display: none; }
    .display { font-family: var(--serif); font-weight: 400; line-height: 1.08; letter-spacing: .045em; }
    .lede { max-width: 42em; font-size: clamp(16px, 1.25vw, 19px); line-height: 2; letter-spacing: .045em; }
    .body-copy { max-width: 70ch; color: var(--muted); font-size: 15px; line-height: 2.05; letter-spacing: .04em; }
    .image-note { color: var(--muted); font-size: 10px; line-height: 1.7; letter-spacing: .12em; }

    .chooser { position: sticky; z-index: 500; top: 0; display: grid; min-height: var(--chooser); grid-template-columns: minmax(240px, .72fr) minmax(650px, 1.28fr); align-items: center; gap: 42px; padding: 10px var(--edge); color: var(--warm-white); background: rgba(36, 23, 16, .985); border-bottom: 1px solid rgba(255,255,255,.14); }
    .chooser__copy { font-size: 12px; line-height: 1.55; letter-spacing: .06em; }
    .chooser__copy small { display: block; color: #cdbdaf; font-size: 10px; }
    .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tab { min-height: 52px; padding: 7px 14px; color: var(--warm-white); background: transparent; border: 1px solid rgba(255,255,255,.25); text-align: left; transition: color 180ms ease, background 180ms ease, border-color 180ms ease; }
    .tab span { display: block; font-family: var(--serif); font-size: 14px; }
    .tab small { display: block; margin-top: 3px; color: #d2c2b5; font-size: 10px; letter-spacing: .08em; }
    .tab[aria-selected="true"] { color: var(--ink); background: var(--saffron); border-color: var(--saffron); }
    .tab[aria-selected="true"] small { color: #503c1f; }

    .site-header { display: flex; height: 88px; align-items: center; justify-content: space-between; gap: 40px; padding: 0 var(--edge); background: rgba(248,245,239,.98); border-bottom: 1px solid var(--line); }
    .logo { width: 184px; }
    .site-nav { display: flex; align-items: center; gap: clamp(24px, 2.6vw, 44px); font-size: 12px; font-weight: 600; letter-spacing: .12em; }
    .site-nav a { text-decoration: none; }
    .site-nav a[aria-current="page"] { padding-bottom: 8px; border-bottom: 1px solid currentColor; }

    .hero { position: relative; display: grid; min-height: 760px; grid-template-columns: minmax(0, 1.62fr) minmax(340px, .72fr); background: var(--paper); }
    .hero__image { position: relative; min-height: 760px; overflow: hidden; }
    .hero__image::after { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(36,23,16,.05), rgba(36,23,16,0) 56%, rgba(36,23,16,.24)); content: ""; }
    .hero__image img { filter: saturate(.78) sepia(.08); }
    .hero__title { position: absolute; z-index: 2; right: clamp(34px, 4vw, 72px); bottom: 62px; max-width: 7.8em; margin: 0; color: var(--warm-white); font-size: clamp(66px, 6.2vw, 104px); text-align: right; text-shadow: 0 3px 24px rgba(36,23,16,.24); }
    .hero__copy { display: flex; min-width: 0; flex-direction: column; justify-content: space-between; gap: 54px; padding: 80px clamp(42px, 4vw, 76px) 58px; }
    .hero__copy .lede { font-family: var(--serif); font-size: clamp(20px, 1.65vw, 28px); line-height: 1.75; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 18px; padding: 30px 0 0; margin: 42px 0 0; border-top: 1px solid var(--line); list-style: none; font-size: 12px; line-height: 1.7; }
    .meta strong { display: block; color: var(--clay); font-size: 10px; letter-spacing: .14em; }
    .primary { display: inline-flex; min-height: 78px; align-items: center; justify-content: space-between; gap: 34px; padding: 0 32px; color: var(--warm-white); background: var(--persimmon); border: 0; text-decoration: none; letter-spacing: .08em; transition: background 180ms ease, transform 420ms var(--ease); }
    .primary:hover { background: #c94f34; transform: translateY(-3px); }
    .primary:disabled { color: #f3e8df; background: var(--clay); transform: none; }
    .arrow { position: relative; width: 22px; height: 22px; flex: 0 0 22px; }
    .arrow::before { position: absolute; top: 10px; left: 1px; width: 18px; border-top: 1.5px solid currentColor; content: ""; }
    .arrow::after { position: absolute; top: 6px; right: 2px; width: 9px; height: 9px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg); content: ""; }

    .chapters { position: sticky; z-index: 120; top: var(--chooser); display: grid; height: 62px; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 var(--edge); background: rgba(248,245,239,.965); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .chapters::after { position: absolute; right: 0; bottom: -1px; left: 0; width: var(--progress, 0%); border-bottom: 2px solid var(--persimmon); content: ""; transition: width 320ms var(--ease); }
    .chapters a { display: grid; place-items: center; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-decoration: none; }
    .chapters a[aria-current="location"] { color: var(--ink); background: color-mix(in srgb, var(--saffron) 45%, transparent); }

    .intro { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(70px, 10vw, 170px); padding: clamp(130px, 13vw, 210px) var(--edge); }
    .intro h2 { max-width: 8.5em; margin: 0; font-size: clamp(54px, 5.6vw, 88px); }
    .intro__copy { padding-top: 18px; }
    .intro__copy .lede { margin-bottom: 34px; }

    .gallery-section { position: relative; padding: 130px var(--edge) 160px; overflow: hidden; background: var(--sand); }
    .gallery-heading { display: flex; align-items: end; justify-content: space-between; gap: 80px; margin-bottom: 76px; }
    .gallery-heading h2 { max-width: 9em; margin: 0; font-size: clamp(50px, 5vw, 80px); }
    .gallery-heading p { max-width: 34em; margin: 0; }
    .photo { position: relative; overflow: hidden; background: #d4c5b7; }
    .photo img { filter: saturate(.68) sepia(.12); transition: filter 800ms ease, transform 1.2s var(--ease); }
    .photo:hover img, .photo[data-active="true"] img { filter: saturate(.95) sepia(.02); transform: scale(1.018); }
    .photo figcaption { position: absolute; right: 0; bottom: 0; left: 0; padding: 28px 18px 15px; color: var(--warm-white); background: linear-gradient(transparent, rgba(36,23,16,.8)); font-size: 10px; line-height: 1.6; letter-spacing: .1em; opacity: 0; transform: translateY(10px); transition: opacity 420ms var(--ease), transform 620ms var(--ease); }
    .photo:hover figcaption, .photo[data-active="true"] figcaption { opacity: 1; transform: translateY(0); }

    .storyboard { display: grid; min-height: 1080px; grid-template-columns: repeat(12, 1fr); grid-template-rows: 230px 230px 170px 280px; gap: 18px; }
    .storyboard .frame--wide { grid-area: 1 / 1 / 3 / 8; }
    .storyboard .frame--detail { grid-area: 1 / 9 / 4 / 13; }
    .storyboard .frame--pair { grid-area: 3 / 2 / 5 / 6; }
    .storyboard .frame--self { grid-area: 3 / 7 / 5 / 11; }
    .storyboard__quote { display: grid; grid-area: 2 / 7 / 4 / 10; z-index: 3; align-content: center; padding: 36px; color: var(--warm-white); background: var(--oxblood); }
    .storyboard__quote blockquote { margin: 0; font-family: var(--serif); font-size: 28px; line-height: 1.65; }

    .collage { position: relative; min-height: 1120px; }
    .collage .frame--wide { position: absolute; top: 0; left: 0; width: 56%; height: 470px; }
    .collage .frame--detail { position: absolute; z-index: 2; top: 180px; right: 4%; width: 31%; height: 600px; }
    .collage .frame--pair { position: absolute; top: 580px; left: 12%; width: 30%; height: 470px; }
    .collage .frame--self { position: absolute; right: 22%; bottom: 0; width: 25%; height: 360px; }
    .collage__statement { position: absolute; z-index: 3; top: 490px; left: 38%; width: 36%; padding: 45px 46px; color: var(--warm-white); background: var(--bark); }
    .collage__statement blockquote { margin: 0; font-family: var(--serif); font-size: 31px; line-height: 1.65; }

    .contact-sheet { margin-right: calc(var(--edge) * -1); margin-left: calc(var(--edge) * -1); padding: 72px 0 78px var(--edge); color: var(--warm-white); background: var(--night); }
    .contact-sheet__track { display: grid; grid-template-columns: 1.25fr .72fr .72fr .72fr .35fr; gap: 12px; overflow: hidden; }
    .contact-sheet .photo { height: 610px; background: #1b120e; }
    .contact-sheet .photo:first-child { height: 610px; }
    .contact-sheet .photo:nth-child(3) { margin-top: 74px; height: 536px; }
    .contact-sheet .photo:nth-child(4) { margin-top: 150px; height: 460px; }
    .contact-sheet__caption { display: flex; height: 610px; flex-direction: column; justify-content: space-between; padding: 0 24px 0 12px; writing-mode: vertical-rl; }
    .contact-sheet__caption strong { color: var(--saffron); font-family: var(--serif); font-size: 22px; font-weight: 400; letter-spacing: .08em; }
    .contact-sheet__caption span { color: #cdbdaf; font-size: 10px; letter-spacing: .15em; }

    .teacher { display: grid; min-height: 760px; grid-template-columns: .86fr 1.14fr; background: var(--paper); }
    .teacher__portrait { position: relative; display: grid; place-items: center; min-height: 760px; color: #d7c7ba; background: var(--bark); }
    .teacher__portrait::before, .teacher__portrait::after { position: absolute; width: 160px; height: 160px; border: 1px solid rgba(248,191,76,.55); border-radius: 50%; content: ""; }
    .teacher__portrait::after { width: 250px; height: 250px; border-color: rgba(247,246,244,.22); }
    .teacher__portrait span { z-index: 1; font-size: 11px; letter-spacing: .14em; }
    .teacher__copy { display: flex; flex-direction: column; justify-content: center; padding: 110px var(--edge) 110px clamp(70px, 7vw, 130px); }
    .teacher__copy h2 { max-width: 8em; margin-bottom: 46px; font-size: clamp(48px, 4.8vw, 74px); }

    .quote { padding: 150px var(--edge); color: var(--warm-white); background: var(--oxblood); }
    .quote blockquote { max-width: 25em; margin: 0 auto; font-family: var(--serif); font-size: clamp(34px, 4vw, 62px); line-height: 1.6; text-align: center; }
    .quote cite { display: block; margin-top: 36px; color: #d8c7b8; font-size: 11px; font-style: normal; letter-spacing: .12em; text-align: center; }

    .curriculum { padding: 150px var(--edge); }
    .curriculum__head { display: grid; grid-template-columns: 1.2fr .8fr; align-items: end; gap: 80px; margin-bottom: 72px; }
    .curriculum__head h2 { max-width: 9em; margin: 0; font-size: clamp(50px, 5.2vw, 82px); }
    .accordion { border-top: 1px solid var(--ink); }
    .accordion__button { display: grid; width: 100%; min-height: 118px; grid-template-columns: 150px 1fr 46px; align-items: center; gap: 30px; padding: 0; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
    .accordion__button span { color: var(--clay); font-size: 11px; letter-spacing: .12em; }
    .accordion__button strong { font-family: var(--serif); font-size: clamp(25px, 2.3vw, 36px); font-weight: 400; }
    .accordion__button i { position: relative; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 50%; }
    .accordion__button i::before, .accordion__button i::after { position: absolute; top: 22px; left: 13px; width: 18px; border-top: 1px solid currentColor; content: ""; }
    .accordion__button i::after { transform: rotate(90deg); transition: transform 220ms ease; }
    .accordion__button[aria-expanded="true"] i::after { transform: rotate(0); }
    .accordion__panel { max-width: 70ch; padding: 30px 0 42px 180px; color: var(--muted); font-size: 15px; line-height: 2; }

    .video { position: relative; display: grid; min-height: 760px; place-items: center; overflow: hidden; color: var(--warm-white); background: var(--night); }
    .video > img { position: absolute; inset: 0; opacity: .5; filter: saturate(.58) contrast(.96); }
    .video::after { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(36,23,16,.8), rgba(36,23,16,.15) 55%, rgba(36,23,16,.72)); content: ""; }
    .video__content { position: relative; z-index: 2; display: grid; width: calc(100% - var(--edge) * 2); grid-template-columns: 1fr auto; align-items: end; gap: 60px; }
    .video h2 { max-width: 10em; margin: 0; font-size: clamp(54px, 5.7vw, 90px); }
    .video__control { display: grid; width: 170px; height: 170px; place-items: center; color: var(--warm-white); background: rgba(36,23,16,.58); border: 1px solid rgba(255,255,255,.56); border-radius: 50%; }
    .video__control::before { width: 0; height: 0; margin-left: 8px; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 24px solid currentColor; content: ""; }
    .video__status { position: absolute; z-index: 3; right: var(--edge); bottom: 42px; padding: 10px 14px; color: var(--night); background: var(--saffron); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
    .asset-label { position: absolute; z-index: 4; top: 22px; right: 22px; padding: 9px 11px; color: var(--warm-white); background: rgba(36,23,16,.76); font-size: 10px; font-weight: 600; letter-spacing: .1em; }

    .audience { display: grid; grid-template-columns: .9fr 1.1fr; gap: 110px; padding: 160px var(--edge); background: var(--sand); }
    .audience h2 { max-width: 6.8em; margin: 0; font-size: clamp(58px, 6vw, 94px); }
    .audience__copy > p { margin-bottom: 46px; }
    .audience__list { padding: 0; margin: 0; border-top: 1px solid var(--ink); list-style: none; }
    .audience__list li { display: grid; min-height: 102px; grid-template-columns: 32px 1fr; align-items: center; gap: 26px; border-bottom: 1px solid var(--line); font-family: var(--serif); font-size: clamp(21px, 2vw, 30px); line-height: 1.55; }
    .audience__list i { width: 10px; height: 10px; background: var(--saffron); border-radius: 50%; }

    .schedule { padding: 150px var(--edge); }
    .schedule__head { display: flex; align-items: end; justify-content: space-between; gap: 70px; margin-bottom: 70px; }
    .schedule__head h2 { max-width: 8.5em; margin: 0; font-size: clamp(50px, 5vw, 80px); }
    .schedule__head p { max-width: 34em; margin: 0; }
    .schedule__grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); }
    .schedule__item { display: grid; min-height: 240px; grid-template-columns: 1fr auto; align-content: space-between; gap: 30px; padding: 36px 36px 36px 0; border-bottom: 1px solid var(--line); }
    .schedule__item + .schedule__item { padding-left: 36px; border-left: 1px solid var(--line); }
    .schedule__item h3 { margin: 0; font-family: var(--serif); font-size: 34px; font-weight: 400; }
    .schedule__item p { grid-column: 1/-1; margin: 0; color: var(--muted); line-height: 1.9; }
    .status { align-self: start; padding: 9px 12px; color: var(--oxblood); background: var(--saffron); font-size: 10px; font-weight: 700; letter-spacing: .1em; }

    .register { display: grid; min-height: 650px; grid-template-columns: 1.08fr .92fr; color: var(--warm-white); background: var(--night); }
    .register__copy { display: flex; flex-direction: column; justify-content: space-between; padding: 110px var(--edge); }
    .register h2 { max-width: 8em; margin: 0 0 40px; font-size: clamp(54px, 5.5vw, 88px); }
    .register .body-copy { color: #d8c7b8; }
    .register__image { position: relative; min-height: 650px; }
    .register__image img { filter: saturate(.52) sepia(.18); }
    .prototype-note { display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 28px var(--edge); color: #d5c5b8; background: #160e0a; border-top: 1px solid rgba(255,255,255,.12); font-size: 11px; line-height: 1.8; letter-spacing: .06em; }
    .prototype-note strong { color: var(--saffron); font-weight: 600; }
    .prototype-note span { max-width: 72em; text-align: right; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <aside class="desktop-note">本輪為桌機版設計稿，建議使用 1440px 以上寬度查看。</aside>
  <main class="prototype">
    <section class="chooser" aria-label="設計稿選擇器">
      <div class="chooser__copy">A「章節潮汐」桌機深化<small>同一內容，三種多圖節奏</small></div>
      <div class="tabs" role="tablist" aria-label="選擇桌機版設計稿">
        <button id="tab-film" class="tab" role="tab" aria-selected="true" aria-controls="concept-film" data-target="film"><span>A1 電影分鏡</span><small>畫面交錯，敘事最完整</small></button>
        <button id="tab-collage" class="tab" role="tab" aria-selected="false" aria-controls="concept-collage" data-target="collage" tabindex="-1"><span>A2 編輯拼貼</span><small>尺度衝突，視覺張力最高</small></button>
        <button id="tab-contact" class="tab" role="tab" aria-selected="false" aria-controls="concept-contact" data-target="contact" tabindex="-1"><span>A3 接觸片</span><small>連續觀察，方法感最強</small></button>
      </div>
    </section>
    <div id="concept-root"></div>
  </main>

  <script>
    const asset = '../../public/images/course-detail/';
    const arrow = '<span class="arrow" aria-hidden="true"></span>';
    const header = `<header class="site-header"><a class="logo" href="/"><img src="../../public/assets/logo-main.png" alt="普那生活空間"></a><nav class="site-nav" aria-label="主要選單"><a href="/course">近期課程</a><a href="/course" aria-current="page">課程探索</a><a href="/article">文章分享</a><a href="/consultation">個案諮詢</a></nav></header>`;
    const meta = `<ul class="meta"><li><strong>授課形式</strong>實體培訓</li><li><strong>課程結構</strong>三階段</li><li><strong>每日時間</strong>待確認（舊站 09:30–18:30）</li><li><strong>招生狀態</strong>資訊待確認</li></ul>`;
    const photo = (name, alt, caption, frameClass) => `<figure class="photo ${frameClass}"><img src="${asset}${name}" alt="${alt}" loading="lazy"><figcaption>${caption}</figcaption></figure>`;
    const galleryPhotos = [
      photo('facial-class.jpg', '接受臉部與肩頸按摩的示意畫面', '觸碰從肩頸開始・舊站影像／設計示意', 'frame--wide'),
      photo('facial-portrait-4.jpg', '臉部局部特寫', '細緻感受臉部狀態・舊站影像／設計示意', 'frame--detail'),
      photo('facial-portrait-3.jpg', '兩張臉部並列的局部特寫', '觀察細微差異・舊站影像／設計示意', 'frame--pair'),
      photo('facial-portrait-7.jpg', '雙手輕觸臉頰的人物特寫', '練習對自己溫柔・舊站影像／設計示意', 'frame--self')
    ];

    function gallery(kind) {
      if (kind === 'film') return `<div class="storyboard">${galleryPhotos[0]}${galleryPhotos[1]}<div class="storyboard__quote"><blockquote>愈是溫柔，愈能讓身體鬆開。</blockquote></div>${galleryPhotos[2]}${galleryPhotos[3]}</div>`;
      if (kind === 'collage') return `<div class="collage">${galleryPhotos.join('')}<div class="collage__statement"><blockquote>觸碰不是矯正，而是陪伴身體重新感覺自己。</blockquote></div></div>`;
      return `<div class="contact-sheet"><div class="contact-sheet__track">${galleryPhotos.join('')}<div class="contact-sheet__caption"><strong>一次一次，讀懂細微變化。</strong><span>舊站影像／設計示意</span></div></div></div>`;
    }

    const accordion = (kind) => `<div class="accordion"><div><button class="accordion__button" aria-expanded="true" aria-controls="${kind}-stage-1"><span>第一階</span><strong>日式回春面部按摩初級班</strong><i aria-hidden="true"></i></button><div id="${kind}-stage-1" class="accordion__panel">學習日本對健康與美麗的觀念、30 個日式面部按摩技巧、頸前區按摩與手工淋巴引流。內容取自舊站，正式發布前仍須核准。</div></div><div><button class="accordion__button" aria-expanded="false" aria-controls="${kind}-stage-2"><span>第二階</span><strong>進階技巧與完整個案</strong><i aria-hidden="true"></i></button><div id="${kind}-stage-2" class="accordion__panel" hidden>深化後頸、頭部與頭皮技巧，並整合前兩階段，建立完整的面部按摩練習流程。</div></div><div><button class="accordion__button" aria-expanded="false" aria-controls="${kind}-stage-3"><span>第三階</span><strong>除皺指壓與能量激活</strong><i aria-hidden="true"></i></button><div id="${kind}-stage-3" class="accordion__panel" hidden>認識面部經絡、穴位與指壓步驟，以溫和方式支持臉部能量流動。</div></div></div>`;

    const labels = {
      film: ['A1｜電影分鏡', '以四個大小不同、彼此錯位的影像段落形成長頁節奏；最接近 A 原本的敘事氣質，也最容易放入課堂紀錄。'],
      collage: ['A2｜編輯拼貼', '以重疊、尺度反差與深色引言切入影像；品牌張力最高，但後台圖片品質需要更嚴格。'],
      contact: ['A3｜接觸片', '以連續特寫建立觀察與練習感；最適合方法性強、需要呈現手位與過程細節的課程。']
    };

    function concept(kind, headingTag) {
      const label = labels[kind];
      return `<article id="concept-${kind}" class="concept concept--${kind}" role="tabpanel" aria-labelledby="tab-${kind}" ${kind === 'film' ? '' : 'hidden'}>${header}<section class="hero"><div class="hero__image"><img src="${asset}facial-class.jpg" alt="接受臉部與肩頸按摩的示意畫面"><span class="asset-label">舊站影像／設計示意</span><${headingTag} class="hero__title display">日式回春<br>面部按摩</${headingTag}></div><div class="hero__copy"><div><p class="lede">以溫柔的碰觸，讓臉部與身體重新記得放鬆。從肩頸、面部到頭部，學習一套由內而外滋養自己的完整手法。</p>${meta}</div><a class="primary" href="#${kind}-schedule"><span>查看梯次與報名</span>${arrow}</a></div></section><nav class="chapters" aria-label="頁內章節"><a href="#${kind}-about" aria-current="location">課程介紹</a><a href="#${kind}-images">學習片段</a><a href="#${kind}-teacher">帶領者</a><a href="#${kind}-course">課程架構</a><a href="#${kind}-video">課程影片</a><a href="#${kind}-audience">適合對象</a><a href="#${kind}-schedule">日期報名</a></nav><section class="intro" id="${kind}-about"><h2 class="display">愈是溫柔，愈能讓身體鬆開。</h2><div class="intro__copy"><p class="lede">面部肌肉十分細緻敏感。這份工作不是矯正，而是透過輕彈、按壓與手指漫步，練習聽見身體。</p><p class="body-copy">課程融合穴位、傳統日式臉部護理與當代身心學。從肩頸的碰觸開始，撫慰日常蓄積的壓力，也在身體形成一份新的註記：我可以慢下來，也可以溫柔地接受自己。</p></div></section><section class="gallery-section" id="${kind}-images"><div class="gallery-heading"><h2 class="display">從觀看，到親手感受細微變化。</h2><p class="body-copy">多圖元件不只是展示照片，而是把手位、表情、節奏與身體反應編成可閱讀的學習片段。</p></div>${gallery(kind)}</section><section class="teacher" id="${kind}-teacher"><div class="teacher__portrait"><span>帶領者正式肖像待提供</span></div><div class="teacher__copy"><h2 class="display">威珀爾<br>Vipal Robert Cohen</h2><p class="lede">從心理學、靜心與身體工作出發，將日式面部按摩帶入跨文化的教學實踐。</p><p class="body-copy">舊站記錄了帶領者的學習經歷、國際個案與教學脈絡。正式頁面保留長文空間，讓資格與方法來源能被完整閱讀；肖像未核准前不以其他人物照片代替。</p></div></section><section class="quote"><blockquote>「當我們慢下來、靜下來，不是去矯正，而是陪伴與傾聽。」</blockquote><cite>學員分享節錄・示意內容，正式發布前須取得核准</cite></section><section class="curriculum" id="${kind}-course"><div class="curriculum__head"><h2 class="display">三階段，讓技巧成為一種覺察。</h2><p class="body-copy">每一階都可展開閱讀；預設只開啟第一階，讓長篇課綱保有呼吸與明確層次。</p></div>${accordion(kind)}</section><section class="video" id="${kind}-video"><img src="${asset}facial-class.jpg" alt="課程影片封面示意"><span class="asset-label">舊站影像／設計示意</span><div class="video__content"><h2 class="display">先看見碰觸的節奏，再決定是否走進課堂。</h2><button class="video__control" type="button" disabled aria-label="課程影片尚未上架"></button></div><span class="video__status">課程影片待上架</span></section><section class="audience" id="${kind}-audience"><h2 class="display">這門課<br>適合誰</h2><div class="audience__copy"><p class="body-copy">不需要按摩基礎。課程以大量親手操練，支持你把所學帶回日常照顧或專業工作。</p><ul class="audience__list"><li><i aria-hidden="true"></i><span>對美與按摩感興趣，想學習完整手法的人</span></li><li><i aria-hidden="true"></i><span>希望深化觸碰品質的美容師與身體工作者</span></li><li><i aria-hidden="true"></i><span>想在照顧他人的同時，也練習與自己相處的人</span></li></ul></div></section><section class="schedule" id="${kind}-schedule"><div class="schedule__head"><h2 class="display">把參與條件看清楚，再安心決定。</h2><p class="body-copy">日期、地點與時間取自舊站內容作版面示意；正式發布前需由內容負責人確認。</p></div><div class="schedule__grid"><article class="schedule__item"><h3>高雄・第一階</h3><span class="status">日期待確認</span><p>舊站時間 09:30–18:30・地點待確認<br>名額與費用待內容負責人確認。</p></article><article class="schedule__item"><h3>高雄・第二階</h3><span class="status">尚未開放</span><p>需完成第一階；日期、名額與報名狀態待發布。</p></article></div></section><section class="register"><div class="register__copy"><div><h2 class="display">為自己留下一段完整的學習時間。</h2><p class="body-copy">報名連結與本期招生資訊尚未核准，因此不顯示假價格、倒數或可點擊的報名連結。</p></div><button class="primary" type="button" disabled><span>報名資訊待確認</span>${arrow}</button></div><div class="register__image"><img src="${asset}facial-portrait-1.jpg" alt="人物臉部特寫，舊站影像設計示意" loading="lazy"><span class="asset-label">舊站影像／設計示意</span></div></section><footer class="prototype-note"><strong>${label[0]}</strong><span>${label[1]}　本輪僅為桌機版，手機版將在方向確認後另行設計。</span></footer></article>`;
    }

    document.querySelector('#concept-root').innerHTML = concept('film', 'h1') + concept('collage', 'div') + concept('contact', 'div');

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];
    function selectTab(tab, focus = false) {
      tabs.forEach((item) => {
        const active = item === tab;
        item.setAttribute('aria-selected', String(active));
        item.tabIndex = active ? 0 : -1;
      });
      panels.forEach((panel) => { panel.hidden = panel.id !== `concept-${tab.dataset.target}`; });
      panels.forEach((panel) => {
        const title = panel.querySelector('.hero__title');
        const active = !panel.hidden;
        const requiredTag = active ? 'H1' : 'DIV';
        if (title.tagName === requiredTag) return;
        const replacement = document.createElement(requiredTag.toLowerCase());
        replacement.className = title.className;
        replacement.innerHTML = title.innerHTML;
        if (!active) {
          replacement.setAttribute('role', 'heading');
          replacement.setAttribute('aria-level', '1');
        }
        title.replaceWith(replacement);
      });
      history.replaceState(null, '', `?concept=${tab.dataset.target}`);
      window.scrollTo({ top: 0, behavior: 'instant' });
      if (focus) tab.focus();
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        let next = index;
        if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
        if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
        if (event.key === 'Home') next = 0;
        if (event.key === 'End') next = tabs.length - 1;
        selectTab(tabs[next], true);
      });
    });

    document.querySelectorAll('.accordion__button').forEach((button) => {
      button.addEventListener('click', () => {
        const expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!expanded));
        button.nextElementSibling.hidden = expanded;
      });
    });

    document.querySelectorAll('.chapters').forEach((navigation) => {
      const links = [...navigation.querySelectorAll('a')];
      const sections = links.map((link) => document.querySelector(link.hash)).filter(Boolean);
      const observer = new IntersectionObserver((entries) => {
        const active = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!active) return;
        const current = links.findIndex((link) => link.hash === `#${active.target.id}`);
        links.forEach((link, index) => index === current ? link.setAttribute('aria-current', 'location') : link.removeAttribute('aria-current'));
        navigation.style.setProperty('--progress', `${((current + 1) / links.length) * 100}%`);
      }, { rootMargin: '-18% 0px -62% 0px', threshold: [0, .18, .45] });
      sections.forEach((section) => observer.observe(section));
    });

    const photoObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => entry.target.dataset.active = String(entry.isIntersecting));
    }, { rootMargin: '-24% 0px -24% 0px', threshold: .42 });
    document.querySelectorAll('.photo').forEach((item) => photoObserver.observe(item));

    const requested = new URLSearchParams(location.search).get('concept');
    selectTab(tabs.find((tab) => tab.dataset.target === requested) || tabs[0]);
  </script>
</body>
</html>
